name: Check infrastructure configuration

on:
  pull_request:
    paths:
      - IN/**
      - .github/workflows/infra-check.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Check Terraform formatting and schema
        working-directory: IN/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Check shell syntax
        run: bash -n IN/runtime/deploy.sh IN/runtime/backup.sh IN/runtime/init-db.sh
