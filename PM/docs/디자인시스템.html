<style>
:root {
  --wt-navy: #35445C;
  --wt-navy-700: #2A3749;
  --wt-navy-100: #D2DAE5;
  --wt-navy-75: #E0E5EC;
  --wt-navy-50: #EBEEF3;
  --wt-ink: #242424;
  --wt-ink-hover: #000000;
  --wt-ivory: #F7F5EF;
  --wt-butter: #F2DB94;
  --wt-butter-50: #FBF3D9;
  --wt-butter-ink: #8A6A12;
  --wt-wine: #823F43;
  --wt-wine-700: #6E3437;
  --wt-wine-100: #E5C8C6;
  --wt-wine-75: #EDD8D6;
  --wt-wine-50: #F4E7E6;
  --wt-card: #FFFFFF;
  --wt-border: #E7E5DF;
  --wt-border-strong: #CFCCC4;
  --wt-muted: #858585;
  --wt-light: #F1F1EE;
  --wt-light-hover: #E8E7E2;
  --wt-text-sub: #555555;
  --wt-text-quiet: #6B6B6B;
  --wt-placeholder: #B3B1AA;
  --wt-on-dark: #FFFFFF;
  --wt-scrim: rgba(36,36,36,0.36);
  --wt-scrim-soft: rgba(36,36,36,0.28);
  --wt-veil: rgba(247,245,239,0.64);
  --wt-board-bg: #E9E6DE;
  --wt-brand-kakao: #FEE500;
  --wt-brand-kakao-ink: #191919;
  --wt-text: var(--wt-ink);
  --wt-text-muted: var(--wt-muted);
  --wt-bg-page: var(--wt-ivory);
  --wt-bg-surface: var(--wt-card);
  --wt-line: var(--wt-border);
  --wt-action: var(--wt-navy);
  --wt-action-hover: var(--wt-navy-700);
  --wt-like: var(--wt-wine);
  --wt-save: var(--wt-navy);
  --wt-danger: var(--wt-wine);
  --wt-danger-hover: var(--wt-wine-700);
  --wt-focus: var(--wt-navy);
  --wt-rate-vpos-bg: var(--wt-navy-100);
  --wt-rate-vpos-fg: var(--wt-navy);
  --wt-rate-pos-bg: var(--wt-navy-75);
  --wt-rate-pos-fg: var(--wt-navy);
  --wt-rate-mpos-bg: var(--wt-navy-50);
  --wt-rate-mpos-fg: var(--wt-navy);
  --wt-rate-mixed-bg: var(--wt-butter-50);
  --wt-rate-mixed-fg: var(--wt-butter-ink);
  --wt-rate-mneg-bg: var(--wt-wine-50);
  --wt-rate-mneg-fg: var(--wt-wine);
  --wt-rate-neg-bg: var(--wt-wine-75);
  --wt-rate-neg-fg: var(--wt-wine);
  --wt-rate-vneg-bg: var(--wt-wine-100);
  --wt-rate-vneg-fg: var(--wt-wine);
  --wt-rate-low-bg: var(--wt-light);
  --wt-rate-low-fg: var(--wt-muted);
  --wt-state-live-bg: var(--wt-navy-50);
  --wt-state-live-fg: var(--wt-navy);
  --wt-state-stop-bg: var(--wt-light);
  --wt-state-stop-fg: var(--wt-muted);
  --wt-state-private-bg: var(--wt-wine-50);
  --wt-state-private-fg: var(--wt-wine);
  --wt-state-temp-bg: var(--wt-butter-50);
  --wt-state-temp-fg: var(--wt-butter-ink);
  --wt-font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --wt-mono: 'JetBrains Mono', ui-monospace, monospace;
  --wt-fs-display: 40px;
  --wt-fs-page: 28px;
  --wt-fs-section: 22px;
  --wt-fs-modal: 20px;
  --wt-fs-lead: 17px;
  --wt-fs-card: 16px;
  --wt-fs-body: 15px;
  --wt-fs-sm: 14px;
  --wt-fs-desc: 13.5px;
  --wt-fs-caption: 12.5px;
  --wt-fs-xs: 11.5px;
  --wt-fs-mono: 11px;
  --wt-fw-regular: 400;
  --wt-fw-medium: 500;
  --wt-fw-semibold: 600;
  --wt-fw-bold: 700;
  --wt-fw-extrabold: 800;
  --wt-lh-tight: 1.2;
  --wt-lh-title: 1.35;
  --wt-lh-desc: 1.45;
  --wt-lh-body: 1.55;
  --wt-lh-prose: 1.75;
  --wt-ls-tight: -0.02em;
  --wt-sp-1: 4px;
  --wt-sp-2: 8px;
  --wt-sp-3: 12px;
  --wt-sp-4: 16px;
  --wt-sp-5: 24px;
  --wt-sp-6: 32px;
  --wt-sp-7: 48px;
  --wt-board-gap: 120px;
  --wt-gap-grid-x: 24px;
  --wt-gap-grid-y: 32px;
  --wt-r-sm: 4px;
  --wt-r-md: 8px;
  --wt-r-lg: 12px;
  --wt-r-pill: 999px;
  --wt-shadow-card: 0 1px 3px rgba(36,36,36,0.08);
  --wt-shadow-hover: 0 8px 24px rgba(36,36,36,0.12);
  --wt-shadow-pop: 0 12px 32px rgba(36,36,36,0.16);
  --wt-shadow-focus: 0 0 0 3px rgba(53,68,92,0.12);
  --wt-max: 1376px;
  --wt-pad-x: 32px;
  --wt-frame-desktop: 1440px;
  --wt-frame-mobile: 390px;
  --wt-sidebar-w: 272px;
  --wt-modal-w: 420px;
  --wt-detail-aside-w: 300px;
  --wt-detail-cta-w: 300px;
  --wt-form-aside-w: 320px;
  --wt-thumb-ratio: 16 / 10;
  --wt-ratio-wide: 16 / 9;
  --wt-ratio-tall: 9 / 16;
  --wt-cols: 4;
  --wt-bw: 1px;
  --wt-h-btn-sm: 30px;
  --wt-h-btn: 36px;
  --wt-h-btn-lg: 48px;
  --wt-h-input: 46px;
  --wt-h-header: 64px;
  --wt-icon-btn: 40px;
  --wt-ds-max: 1200px;
}

/* =========================================================
   WEBTER — 공통 스타일 (토큰 :root 블록은 빌드 때 앞에 붙는다)
   - 역할이 드러나는 클래스(.wt-card, .wt-review-item …)만 사용
   - 장식·위치 맞춤용 transform / backdrop-filter / filter / 다중 그림자 사용 안 함
   - 중요한 점·아이콘·구분선은 실제 요소 또는 인라인 SVG
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--wt-bg-page); color: var(--wt-text); font-family: var(--wt-font); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin-top: 0; }
:focus-visible { outline: 2px solid var(--wt-focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- App shell ---------- */
.wt-app { position: relative; background: var(--wt-bg-page); color: var(--wt-text); font-size: var(--wt-fs-body); line-height: var(--wt-lh-body); }
.wt-page { container-type: inline-size; container-name: app; min-height: 100vh; display: flex; flex-direction: column; background: var(--wt-bg-page); }
.wt-page > main { flex: 1; }
.wt-app.is-frozen .wt-page { min-height: 0; }
.wt-wrap { width: 100%; max-width: var(--wt-max); margin: 0 auto; padding: 0 var(--wt-pad-x); }
.wt-mono { font-family: var(--wt-mono); }
.wt-muted { color: var(--wt-muted); }
.wt-page-title { font-size: var(--wt-fs-page); font-weight: var(--wt-fw-extrabold); letter-spacing: -0.025em; margin: 0; line-height: var(--wt-lh-tight); }

/* 오버레이 레이어: 실제 화면은 뷰포트 고정, 보드·예제는 프레임 안 absolute */
.wt-layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.wt-layer:empty { display: none; }
.wt-layer > * { pointer-events: auto; }
.wt-app.is-frozen .wt-layer { position: absolute; }
.wt-scrim { position: absolute; inset: 0; background: var(--wt-scrim-soft); }
.wt-modal-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--wt-sp-5); background: var(--wt-scrim); }
.wt-modal { position: relative; width: 100%; max-width: var(--wt-modal-w); max-height: 100%; overflow-y: auto; background: var(--wt-card); border-radius: var(--wt-r-lg); box-shadow: var(--wt-shadow-pop); padding: 28px; }
.wt-modal.w-md { max-width: 520px; }
.wt-modal.w-lg { max-width: 640px; }
.wt-modal h3 { margin: 0 0 var(--wt-sp-2); font-size: var(--wt-fs-modal); font-weight: var(--wt-fw-extrabold); letter-spacing: var(--wt-ls-tight); line-height: var(--wt-lh-title); padding-right: var(--wt-sp-6); }
.wt-modal p { margin: 0; color: var(--wt-text-sub); font-size: var(--wt-fs-sm); }
.wt-modal > .wt-modal-x { position: absolute; top: 14px; right: 14px; }
.wt-modal-actions { display: flex; gap: var(--wt-sp-2); margin-top: var(--wt-sp-5); }
.wt-modal-actions .wt-btn { flex: 1; height: 44px; }
.wt-modal-icon { width: 48px; height: 48px; border-radius: var(--wt-r-lg); display: grid; place-items: center; margin-bottom: var(--wt-sp-4); }
.wt-modal-icon.butter { background: var(--wt-butter-50); color: var(--wt-butter-ink); }
.wt-modal-icon.wine { background: var(--wt-wine-50); color: var(--wt-wine); }
.wt-modal-icon.navy { background: var(--wt-navy-50); color: var(--wt-navy); }
.wt-toast-wrap { position: absolute; left: 0; right: 0; bottom: var(--wt-sp-6); display: flex; justify-content: center; pointer-events: none; padding: 0 var(--wt-sp-4); }
.wt-toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--wt-ink); color: var(--wt-on-dark); padding: 12px 18px; border-radius: var(--wt-r-pill); font-size: var(--wt-fs-sm); font-weight: var(--wt-fw-medium); box-shadow: var(--wt-shadow-pop); max-width: 100%; }
.wt-toast button { background: none; border: 0; color: var(--wt-butter); font-weight: var(--wt-fw-bold); font-size: var(--wt-fs-sm); padding: 0; white-space: nowrap; }

/* ---------- Wordmark ---------- */
.wt-logo { display: inline-flex; align-items: baseline; font-weight: var(--wt-fw-extrabold); font-size: 22px; letter-spacing: var(--wt-ls-tight); color: var(--wt-ink); line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; }
.wt-logo .ter { color: var(--wt-navy); font-weight: var(--wt-fw-medium); }
.wt-logo .wt-logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--wt-butter); margin-left: 3px; align-self: flex-end; margin-bottom: 2px; border: 1px solid rgba(36,36,36,0.12); }

/* ---------- Header ---------- */
.wt-header { position: sticky; top: 0; z-index: 30; background: var(--wt-bg-page); }
.wt-app.is-frozen .wt-header { position: static; }
.wt-header-in { height: var(--wt-h-header); display: flex; align-items: center; gap: var(--wt-sp-3); }
.wt-header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.wt-iconbtn { width: var(--wt-icon-btn); height: var(--wt-icon-btn); display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--wt-ink); flex-shrink: 0; position: relative; }
.wt-iconbtn:hover, .wt-iconbtn[data-hover="true"] { background: rgba(36,36,36,0.06); }
.wt-iconbtn.sm { width: 32px; height: 32px; }
.wt-os-entry { display: inline-flex; align-items: center; gap: 6px; height: var(--wt-icon-btn); padding: 0 6px 0 4px; border-radius: var(--wt-r-pill); border: 0; background: transparent; color: var(--wt-ink); }
.wt-os-entry:hover, .wt-os-entry[data-hover="true"] { background: rgba(36,36,36,0.06); }
.wt-avatar-btn { display: flex; align-items: center; gap: 2px; background: none; border: 0; padding: 4px; border-radius: var(--wt-r-pill); color: var(--wt-muted); }
.wt-pop-wrap { position: relative; }
.wt-pop { position: absolute; top: calc(100% + 8px); right: 0; background: var(--wt-card); border-radius: var(--wt-r-md); box-shadow: var(--wt-shadow-pop); border: 1px solid var(--wt-border); min-width: 248px; padding: 6px; z-index: 40; }
.wt-pop-item { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: none; border: 0; height: 40px; padding: 0 12px; border-radius: 6px; font-size: var(--wt-fs-sm); color: var(--wt-ink); }
.wt-pop-item:hover, .wt-pop-item[data-hover="true"] { background: var(--wt-light); }
.wt-pop-item .cnt { margin-left: auto; font-family: var(--wt-mono); font-size: var(--wt-fs-mono); color: var(--wt-muted); }
.wt-pop-sep { height: 1px; background: var(--wt-light); margin: 6px 4px; border: 0; }
.wt-pop-head { display: flex; gap: var(--wt-sp-3); align-items: center; padding: 12px 12px 14px; }
.wt-pop-head b { display: block; font-size: var(--wt-fs-body); }
.wt-pop-head span { font-size: var(--wt-fs-caption); color: var(--wt-muted); }

/* ---------- Main nav ---------- */
.wt-nav { display: flex; align-items: center; gap: var(--wt-sp-1); height: 52px; }
.wt-nav-tab { height: 52px; padding: 0 14px; display: inline-flex; align-items: center; background: none; border: 0; border-bottom: 2px solid transparent; font-size: var(--wt-fs-lead); font-weight: var(--wt-fw-semibold); color: var(--wt-muted); }
.wt-nav-tab:hover, .wt-nav-tab[data-hover="true"] { color: var(--wt-ink); }
.wt-nav-tab.active { color: var(--wt-ink); font-weight: var(--wt-fw-bold); border-bottom-color: var(--wt-ink); }

/* ---------- Buttons ---------- */
.wt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--wt-h-btn); padding: 0 var(--wt-sp-4); border-radius: var(--wt-r-pill); font-size: var(--wt-fs-sm); font-weight: var(--wt-fw-semibold); border: var(--wt-bw) solid transparent; white-space: nowrap; background: transparent; line-height: 1; }
.wt-btn-primary { background: var(--wt-action); color: var(--wt-on-dark); }
.wt-btn-primary:hover, .wt-btn-primary[data-hover="true"] { background: var(--wt-action-hover); }
.wt-btn-ink { background: var(--wt-ink); color: var(--wt-on-dark); }
.wt-btn-ink:hover, .wt-btn-ink[data-hover="true"] { background: var(--wt-ink-hover); }
.wt-btn-outline { background: transparent; color: var(--wt-ink); border-color: var(--wt-ink); }
.wt-btn-outline:hover, .wt-btn-outline[data-hover="true"] { background: var(--wt-ink); color: var(--wt-on-dark); }
.wt-btn-ghost { background: transparent; color: var(--wt-ink); border-color: var(--wt-border); }
.wt-btn-ghost:hover, .wt-btn-ghost[data-hover="true"] { background: var(--wt-light); }
.wt-btn-soft { background: var(--wt-light); color: var(--wt-ink); }
.wt-btn-soft:hover, .wt-btn-soft[data-hover="true"] { background: var(--wt-light-hover); }
.wt-btn-danger { background: var(--wt-danger); color: var(--wt-on-dark); }
.wt-btn-danger:hover, .wt-btn-danger[data-hover="true"] { background: var(--wt-danger-hover); }
.wt-btn-lg { height: var(--wt-h-btn-lg); padding: 0 var(--wt-sp-5); font-size: var(--wt-fs-card); }
.wt-btn-sm { height: var(--wt-h-btn-sm); padding: 0 var(--wt-sp-3); font-size: 13px; }
.wt-btn-block { width: 100%; }
.wt-btn-icon { width: var(--wt-h-btn); padding: 0; }
.wt-btn[disabled], .wt-btn.is-disabled { opacity: 0.45; cursor: not-allowed; }
.wt-btn.is-on-like { color: var(--wt-like); border-color: var(--wt-like); background: var(--wt-wine-50); }
.wt-btn.is-on-save { color: var(--wt-save); border-color: var(--wt-save); background: var(--wt-navy-50); }
.wt-btn-social { height: 48px; width: 100%; font-size: var(--wt-fs-body); gap: 10px; }
.wt-btn-google { background: var(--wt-card); border-color: var(--wt-border-strong); color: var(--wt-ink); }
.wt-btn-google:hover { background: var(--wt-light); }
.wt-btn-kakao { background: var(--wt-brand-kakao); color: var(--wt-brand-kakao-ink); }
.wt-btn-kakao:hover { background: var(--wt-brand-kakao); }

/* ---------- Segmented / chips / tags / badges ---------- */
.wt-seg { display: inline-flex; background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-pill); padding: 3px; gap: 2px; }
.wt-seg button { border: 0; background: transparent; height: 30px; padding: 0 14px; border-radius: var(--wt-r-pill); font-size: 13px; font-weight: var(--wt-fw-semibold); color: var(--wt-muted); display: inline-flex; align-items: center; gap: 6px; }
.wt-seg button.on { background: var(--wt-ink); color: var(--wt-on-dark); }
.wt-seg button.icon { padding: 0 10px; }
.wt-chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 14px; border-radius: var(--wt-r-pill); border: var(--wt-bw) solid var(--wt-border); background: var(--wt-card); font-size: 13px; font-weight: var(--wt-fw-semibold); color: var(--wt-ink); white-space: nowrap; }
.wt-chip:hover, .wt-chip[data-hover="true"] { border-color: var(--wt-border-strong); }
.wt-chip.on { background: var(--wt-navy); color: var(--wt-on-dark); border-color: var(--wt-navy); }
.wt-chip.fixed { background: var(--wt-navy-50); color: var(--wt-navy); border-color: var(--wt-navy-50); cursor: default; }
.wt-chip.sm { height: 26px; padding: 0 10px; font-size: 12px; }
.wt-chip .cnt { font-family: var(--wt-mono); font-size: var(--wt-fs-mono); opacity: 0.7; }
.wt-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--wt-r-pill); background: var(--wt-light); color: var(--wt-text-sub); font-size: 12px; font-weight: var(--wt-fw-medium); white-space: nowrap; }
.wt-tag.main { background: var(--wt-navy-50); color: var(--wt-navy); font-weight: var(--wt-fw-semibold); }
.wt-attr { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--wt-r-sm); background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); font-size: 12.5px; color: var(--wt-text-sub); white-space: nowrap; }
.wt-attr b { color: var(--wt-ink); font-weight: var(--wt-fw-semibold); }
.wt-status { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--wt-r-sm); font-size: var(--wt-fs-xs); font-weight: var(--wt-fw-semibold); letter-spacing: -0.01em; white-space: nowrap; }
.wt-status .wt-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }
.wt-status.live { background: var(--wt-state-live-bg); color: var(--wt-state-live-fg); }
.wt-status.stop { background: var(--wt-state-stop-bg); color: var(--wt-state-stop-fg); }
.wt-status.private { background: var(--wt-state-private-bg); color: var(--wt-state-private-fg); }
.wt-status.temp { background: var(--wt-state-temp-bg); color: var(--wt-state-temp-fg); }
.wt-scope { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; font-family: var(--wt-mono); font-size: 10px; font-weight: var(--wt-fw-medium); letter-spacing: 0.02em; border: 1px dashed currentColor; white-space: nowrap; vertical-align: middle; }
.wt-scope.ext { color: var(--wt-wine); background: var(--wt-wine-50); }
.wt-app.hide-scope .wt-scope { display: none; }
.wt-rate { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--wt-r-sm); font-size: var(--wt-fs-xs); font-weight: var(--wt-fw-semibold); white-space: nowrap; letter-spacing: -0.01em; }
.wt-rate.lg { height: 28px; padding: 0 12px; font-size: 13px; }
.wt-rate.vpos { background: var(--wt-rate-vpos-bg); color: var(--wt-rate-vpos-fg); font-weight: var(--wt-fw-bold); }
.wt-rate.pos { background: var(--wt-rate-pos-bg); color: var(--wt-rate-pos-fg); }
.wt-rate.mpos { background: var(--wt-rate-mpos-bg); color: var(--wt-rate-mpos-fg); }
.wt-rate.mixed { background: var(--wt-rate-mixed-bg); color: var(--wt-rate-mixed-fg); }

/* ---------- Service card ---------- */

.wt-card[data-hover="true"] .wt-card-launch, .wt-card[data-hover="true"] .wt-card-rating { opacity: 1; }
.wt-card-body { padding: var(--wt-sp-4) var(--wt-sp-4) 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.wt-card-title { margin: 0; font-size: var(--wt-fs-card); font-weight: var(--wt-fw-bold); letter-spacing: -0.01em; line-height: var(--wt-lh-title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.wt-card-foot { display: flex; align-items: center; gap: var(--wt-sp-3); padding: 10px var(--wt-sp-4); border-top: 1px solid var(--wt-light); min-height: 41px; }

/* 목록형 */

.wt-li:hover .wt-card-launch, .wt-li:hover .wt-card-rating, .wt-li:focus-within .wt-card-launch, .wt-li:focus-within .wt-card-rating,

/* ---------- Search ---------- */
.wt-search { position: relative; display: flex; align-items: center; background: var(--wt-card); border: 1.5px solid var(--wt-ink); border-radius: var(--wt-r-pill); height: 60px; padding: 0 8px 0 24px; gap: var(--wt-sp-3); }

.wt-search-hint { font-family: var(--wt-mono); font-size: var(--wt-fs-mono); color: var(--wt-navy); background: var(--wt-navy-50); padding: 3px 8px; border-radius: var(--wt-r-sm); white-space: nowrap; }
.wt-search-go { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--wt-navy); color: var(--wt-on-dark); display: grid; place-items: center; flex-shrink: 0; }
.wt-search-go:hover { background: var(--wt-navy-700); }

/* ---------- Misc ---------- */

/* =========================================================
   WEBTER — 화면별 스타일 · 반응형(컨테이너 쿼리) · 보드 · 디자인 시스템 페이지
   ========================================================= */

/* ---------- Home ---------- */
.wt-hero { text-align: center; padding: 56px 0 8px; }
.wt-hero-title { font-size: var(--wt-fs-display); font-weight: var(--wt-fw-extrabold); letter-spacing: -0.035em; margin: 0; line-height: var(--wt-lh-tight); text-wrap: balance; }
.wt-hero-sub { margin: var(--wt-sp-3) 0 28px; color: var(--wt-muted); font-size: var(--wt-fs-card); text-wrap: balance; }
.wt-hero-search { max-width: 880px; margin: 0 auto; }
.wt-interest { display: flex; align-items: center; justify-content: center; gap: var(--wt-sp-2); margin-top: var(--wt-sp-5); font-size: 13.5px; color: var(--wt-text-sub); flex-wrap: wrap; }

/* ---------- List pages ---------- */
.wt-list-head { padding: var(--wt-sp-6) 0 var(--wt-sp-4); display: flex; flex-direction: column; gap: 6px; }
.wt-list-head p { margin: 0; color: var(--wt-muted); font-size: var(--wt-fs-sm); }
.wt-toolbar { display: flex; align-items: center; gap: var(--wt-sp-3); flex-wrap: wrap; padding: var(--wt-sp-3) 0 var(--wt-sp-4); }
.wt-toolbar .grow { margin-left: auto; display: flex; align-items: center; gap: var(--wt-sp-3); flex-wrap: wrap; }
.wt-toolbar .count { font-size: var(--wt-fs-sm); color: var(--wt-text-sub); }
.wt-toolbar .count b { color: var(--wt-ink); }
.wt-toolbar .fixed-sort { font-size: 13px; color: var(--wt-muted); display: inline-flex; align-items: center; gap: 6px; }
.wt-filter { background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); padding: var(--wt-sp-2) var(--wt-sp-5); margin-bottom: var(--wt-sp-5); }
.wt-fgroup { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: var(--wt-sp-3); padding: 14px 0; border-top: 1px solid var(--wt-light); align-items: start; }
.wt-fgroup:first-child { border-top: 0; }
.wt-fgroup > b { font-size: 13px; line-height: 32px; }
.wt-fgroup .chips { display: flex; flex-wrap: wrap; gap: var(--wt-sp-2); }
.wt-filter-foot { display: flex; align-items: center; gap: var(--wt-sp-3); padding: 12px 0 14px; border-top: 1px solid var(--wt-light); font-size: 13px; color: var(--wt-muted); }
.wt-mobile-only { display: none; }
.wt-note { display: flex; align-items: center; gap: var(--wt-sp-2); font-size: 13px; color: var(--wt-text-quiet); background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); padding: 10px 14px; margin-bottom: var(--wt-sp-5); flex-wrap: wrap; }
.wt-ai-box { margin-bottom: var(--wt-sp-5); background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); padding: var(--wt-sp-4) 18px; display: flex; flex-direction: column; gap: 10px; }
.wt-ai-box .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wt-ai-box h3 { margin: 0; font-size: var(--wt-fs-card); display: flex; align-items: center; gap: 8px; }
.wt-quota { font-family: var(--wt-mono); font-size: 12px; color: var(--wt-text-quiet); }
.wt-search-top { max-width: 760px; }
.wt-os-banner { display: flex; align-items: center; gap: 10px; }

/* ---------- Detail ---------- */
.wt-crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--wt-muted); padding: var(--wt-sp-5) 0 var(--wt-sp-4); }
.wt-crumb a:hover { color: var(--wt-ink); }
.wt-crumb b { color: var(--wt-ink); font-weight: var(--wt-fw-semibold); }
.wt-banner { display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-radius: var(--wt-r-md); margin-bottom: var(--wt-sp-4); font-size: var(--wt-fs-sm); line-height: 1.5; }
.wt-banner.stop { background: var(--wt-light); color: var(--wt-text-sub); border: var(--wt-bw) solid var(--wt-border); }
.wt-banner b { color: var(--wt-ink); }
.wt-d-top { display: grid; grid-template-columns: 96px minmax(0, 1fr) var(--wt-detail-cta-w); gap: 28px; align-items: start; }
.wt-d-info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.wt-d-title { font-size: 34px; font-weight: var(--wt-fw-extrabold); letter-spacing: -0.03em; margin: 0; line-height: var(--wt-lh-tight); overflow-wrap: anywhere; }
.wt-d-tagline { margin: 0; font-size: 16.5px; color: var(--wt-text-sub); text-wrap: pretty; }
.wt-d-cats { display: flex; flex-wrap: wrap; gap: 6px; }
.wt-d-attrs { display: flex; flex-wrap: wrap; gap: 6px; }
.wt-d-owner { display: inline-flex; align-items: center; gap: 8px; font-size: var(--wt-fs-sm); color: var(--wt-muted); align-self: flex-start; }
.wt-d-owner b { color: var(--wt-ink); }
.wt-d-owner:hover b { text-decoration: underline; }
.wt-d-actions { display: flex; flex-direction: column; gap: var(--wt-sp-2); }
.wt-d-launch { width: 100%; height: 52px; font-size: var(--wt-fs-card); }
.wt-d-react { display: flex; gap: var(--wt-sp-2); }
.wt-d-react .wt-btn { flex: 1; padding: 0 10px; }
.wt-d-notice { font-size: 12px; color: var(--wt-muted); line-height: 1.5; margin: 2px 0 0; }
.wt-d-own-note { font-size: 12.5px; color: var(--wt-text-sub); background: var(--wt-light); border-radius: var(--wt-r-md); padding: 8px 12px; line-height: 1.5; }
.wt-d-stats { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: var(--wt-sp-6); border-top: var(--wt-bw) solid var(--wt-border); border-bottom: var(--wt-bw) solid var(--wt-border); }
.wt-d-stats > div { padding: var(--wt-sp-4) 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: center; min-width: 0; }
.wt-d-stats > div + div { border-left: var(--wt-bw) solid var(--wt-border); }
.wt-d-stat-v { font-size: 18px; font-weight: var(--wt-fw-extrabold); font-variant-numeric: tabular-nums; }
.wt-d-stat-k { font-size: 12px; color: var(--wt-muted); }
.wt-gallery { display: flex; gap: var(--wt-sp-3); overflow-x: auto; padding: var(--wt-sp-6) 0 var(--wt-sp-2); scrollbar-width: thin; }
.wt-shot { position: relative; flex-shrink: 0; border: var(--wt-bw) solid var(--wt-border); border-radius: 6px; overflow: hidden; background: var(--wt-light); padding: 0; display: block; }
.wt-shot:hover { border-color: var(--wt-border-strong); box-shadow: var(--wt-shadow-card); }
.wt-shot.wide { height: 236px; aspect-ratio: var(--wt-ratio-wide); }
.wt-shot.tall { height: 340px; aspect-ratio: var(--wt-ratio-tall); }
.wt-shot .wt-thumb { position: absolute; inset: 0; aspect-ratio: auto; }
.wt-shot.contain { display: grid; place-items: center; }
.wt-shot.contain .wt-thumb { position: relative; inset: auto; width: 100%; aspect-ratio: var(--wt-thumb-ratio); }
.wt-shot-cap { font-size: 12px; color: var(--wt-muted); margin: 4px 0 0; }
.wt-d-tabs { margin-top: var(--wt-sp-5); }
.wt-d-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--wt-detail-aside-w); gap: var(--wt-sp-7); margin-top: var(--wt-sp-5); align-items: start; }
.wt-d-main { min-width: 0; }
.wt-prose h3 { font-size: var(--wt-fs-card); font-weight: var(--wt-fw-extrabold); margin: 0 0 10px; letter-spacing: -0.01em; }
.wt-prose p { margin: 0 0 12px; font-size: 15.5px; line-height: var(--wt-lh-prose); color: #3A3A3A; text-wrap: pretty; }
.wt-prose .wt-d-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: var(--wt-sp-5); }
.wt-owner-card { background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); padding: 20px; display: flex; flex-direction: column; gap: var(--wt-sp-3); }
.wt-owner-card .head { display: flex; align-items: center; gap: var(--wt-sp-3); }
.wt-owner-card b { font-size: var(--wt-fs-body); }
.wt-owner-card p { margin: 0; font-size: 13.5px; color: var(--wt-text-sub); line-height: 1.5; }
.wt-versions { margin-top: var(--wt-sp-6); border-top: var(--wt-bw) solid var(--wt-border); padding-top: var(--wt-sp-3); }
.wt-versions > button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; font-size: 13px; font-weight: var(--wt-fw-semibold); color: var(--wt-muted); }
.wt-ver { padding: var(--wt-sp-3) 0; border-top: 1px solid var(--wt-light); font-size: 13.5px; display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: var(--wt-sp-3); align-items: start; }
.wt-ver:first-of-type { border-top: 0; }
.wt-ver .v { font-family: var(--wt-mono); font-size: 12px; color: var(--wt-navy); font-weight: var(--wt-fw-bold); }
.wt-ver .t { font-weight: var(--wt-fw-semibold); }
.wt-ver .b { color: var(--wt-text-sub); line-height: 1.55; margin-top: 2px; }
.wt-ver .d { font-family: var(--wt-mono); font-size: 11px; color: var(--wt-muted); }
.wt-similar { margin-top: var(--wt-sp-7); }

/* Reviews */
.wt-rv-summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--wt-sp-5); align-items: center; padding: 20px 24px; background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); margin-bottom: var(--wt-sp-5); }
.wt-rv-summary .big { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.wt-rv-summary .pct { font-size: 26px; font-weight: var(--wt-fw-extrabold); font-variant-numeric: tabular-nums; }
.wt-rv-nums { display: flex; gap: var(--wt-sp-4); font-size: 13px; color: var(--wt-text-sub); margin-top: 8px; flex-wrap: wrap; }
.wt-rv-nums span { display: inline-flex; align-items: center; gap: 4px; }
.wt-rvform { background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); padding: 20px; display: flex; flex-direction: column; gap: var(--wt-sp-3); margin-bottom: var(--wt-sp-5); }
.wt-rvform .row { display: flex; align-items: center; gap: var(--wt-sp-3); flex-wrap: wrap; }
.wt-rvform .foot { display: flex; align-items: center; gap: var(--wt-sp-3); flex-wrap: wrap; }
.wt-rvform .foot .grow { margin-left: auto; display: flex; gap: var(--wt-sp-2); align-items: center; }
.wt-rvform .wt-textarea { min-height: 96px; }
.wt-rv-cap { font-size: 13px; color: var(--wt-muted); margin: 0 0 var(--wt-sp-2); }
.wt-reviews { display: flex; flex-direction: column; }
.wt-review-item { padding: 20px 0; border-bottom: var(--wt-bw) solid var(--wt-border); display: flex; flex-direction: column; gap: 10px; }
.wt-review-item:first-child { padding-top: 4px; }
.wt-review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wt-review-head b { font-size: var(--wt-fs-sm); }
.wt-review-head .date { font-family: var(--wt-mono); font-size: 11.5px; color: var(--wt-muted); margin-left: auto; }
.wt-rv-who { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--wt-r-sm); font-size: 11px; font-weight: var(--wt-fw-semibold); background: var(--wt-light); color: var(--wt-text-sub); }
.wt-rv-who.owner { background: var(--wt-ink); color: var(--wt-on-dark); }
.wt-rv-who.anon { background: var(--wt-light); }
.wt-rv-who.guest { background: var(--wt-butter-50); color: var(--wt-butter-ink); }
.wt-rv-who.gone { background: var(--wt-light); color: var(--wt-muted); }
.wt-rv-ico { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: var(--wt-fw-semibold); }
.wt-rv-ico.pos { color: var(--wt-navy); }
.wt-rv-ico.neg { color: var(--wt-wine); }
.wt-rv-ico.unset { color: var(--wt-muted); }
.wt-review-text { margin: 0; font-size: 14.5px; line-height: 1.65; color: #3A3A3A; white-space: pre-wrap; overflow-wrap: anywhere; }
.wt-review-actions { display: flex; gap: var(--wt-sp-1); align-items: center; }
.wt-review-actions button { background: none; border: 0; font-size: 12.5px; color: var(--wt-muted); padding: 4px 8px 4px 0; display: inline-flex; align-items: center; gap: 4px; }
.wt-review-actions button:hover { color: var(--wt-ink); }
.wt-review-actions button[disabled] { cursor: default; color: var(--wt-muted); }
.wt-review-actions button.done { color: var(--wt-wine); }
.wt-review-reply { margin-left: 36px; background: var(--wt-light); border-radius: var(--wt-r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.wt-review-reply .head { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.wt-review-reply .head .date { margin-left: auto; font-family: var(--wt-mono); font-size: 11px; color: var(--wt-muted); }
.wt-review-reply p { margin: 0; font-size: 14px; line-height: 1.6; color: #3A3A3A; white-space: pre-wrap; overflow-wrap: anywhere; }
.wt-reply-form { margin-left: 36px; display: flex; flex-direction: column; gap: var(--wt-sp-2); }
.wt-reply-form .wt-textarea { min-height: 72px; }
.wt-review-login { display: flex; align-items: center; gap: var(--wt-sp-3); flex-wrap: wrap; }
.wt-d-mobilebar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: var(--wt-sp-2); padding: 10px var(--wt-sp-4); background: var(--wt-bg-page); border-top: var(--wt-bw) solid var(--wt-border); }
.wt-d-mobilebar .wt-btn { flex: 1; height: 44px; }
.wt-d-mobilebar .wt-iconbtn { width: 44px; height: 44px; border: var(--wt-bw) solid var(--wt-border); background: var(--wt-card); }
.wt-page.has-mobilebar { padding-bottom: 72px; }


/* ---------- 서비스 용도 줄 (목록 위 가운데) ---------- */
.wt-catbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--wt-sp-2); padding: var(--wt-sp-2) 0 var(--wt-sp-4); }
.wt-catbar-grp { display: inline-flex; flex-wrap: wrap; gap: var(--wt-sp-2); }
.wt-catbar-sep { display: inline-block; width: 1px; height: 18px; background: var(--wt-border-strong); margin: 0 var(--wt-sp-1); }

/* ---------- 서비스 정보 · 마크다운 소개 ---------- */
.wt-info { margin-bottom: var(--wt-sp-5); }
.wt-info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 0; border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); background: var(--wt-card); overflow: hidden; }
.wt-info-grid > div { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--wt-light); border-left: 1px solid var(--wt-light); min-width: 0; }
.wt-info-grid > div:nth-child(-n+3) { border-top: 0; }
.wt-info-grid > div:nth-child(3n+1) { border-left: 0; }
.wt-info-grid dt { font-size: 12px; color: var(--wt-muted); }
.wt-info-grid dd { margin: 0; font-size: var(--wt-fs-sm); font-weight: var(--wt-fw-semibold); overflow-wrap: anywhere; }
.wt-md-wrap { position: relative; }
.wt-md-wrap.is-collapsed { max-height: 220px; overflow: hidden; }
.wt-md-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: linear-gradient(transparent, var(--wt-bg-page)); }
.wt-md-toggle { margin-top: var(--wt-sp-3); }
.wt-md { font-size: 15.5px; line-height: var(--wt-lh-prose); color: #3A3A3A; overflow-wrap: anywhere; }
.wt-md > :first-child { margin-top: 0; }
.wt-md p { margin: 0 0 12px; }
.wt-md h2, .wt-md h3, .wt-md h4, .wt-md h5, .wt-md h6 { margin: 20px 0 8px; font-weight: var(--wt-fw-extrabold); letter-spacing: -0.01em; line-height: var(--wt-lh-title); color: var(--wt-ink); font-size: 15.5px; }
.wt-md .wt-md-h1 { font-size: 20px; padding-bottom: 6px; border-bottom: 1px solid var(--wt-border); }
.wt-md .wt-md-h2 { font-size: 17.5px; }
.wt-md .wt-md-h3 { font-size: 16px; }
.wt-md-list { margin: 0 0 12px; padding-left: 22px; }
.wt-md-list li { margin: 2px 0; }
.wt-md-list input[type="checkbox"] { margin: 0 6px 0 -18px; accent-color: var(--wt-navy); vertical-align: -1px; }
.wt-md code { font-family: var(--wt-mono); font-size: 0.88em; background: var(--wt-light); padding: 1px 6px; border-radius: var(--wt-r-sm); }
.wt-md-pre { margin: 0 0 12px; background: var(--wt-ink); color: var(--wt-on-dark); border-radius: var(--wt-r-md); padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.wt-md-pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
.wt-md-quote { margin: 0 0 12px; padding: 4px 0 4px 16px; border-left: 3px solid var(--wt-border-strong); color: var(--wt-text-sub); }
.wt-md-quote > :last-child { margin-bottom: 0; }
.wt-md-hr { border: 0; border-top: 1px solid var(--wt-border); margin: 18px 0; }
.wt-md a { color: var(--wt-navy); text-decoration: underline; text-underline-offset: 2px; }
.wt-md-tablewrap { overflow-x: auto; margin: 0 0 12px; }
.wt-md-table { border-collapse: collapse; font-size: 14px; min-width: 60%; }
.wt-md-table th, .wt-md-table td { border: 1px solid var(--wt-border); padding: 8px 12px; text-align: left; }
.wt-md-table th { background: var(--wt-light); font-weight: var(--wt-fw-bold); }
.wt-md-img { display: inline-block; background: var(--wt-light); color: var(--wt-muted); font-size: 12.5px; padding: 2px 8px; border-radius: var(--wt-r-sm); }
.wt-md-previewbox { border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); padding: 16px 18px; min-height: 140px; background: var(--wt-card); }

/* ---------- 리뷰 추천·정렬 · 댓글 ---------- */
.wt-rv-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--wt-sp-3); flex-wrap: wrap; margin-bottom: var(--wt-sp-2); }
.wt-votes { display: inline-flex; gap: var(--wt-sp-2); margin-right: var(--wt-sp-2); }
.wt-review-actions .wt-vote { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: var(--wt-r-pill); border: var(--wt-bw) solid var(--wt-border); background: var(--wt-card); font-size: 12.5px; color: var(--wt-text-sub); font-variant-numeric: tabular-nums; }
.wt-review-actions .wt-vote:hover { border-color: var(--wt-border-strong); color: var(--wt-ink); }
.wt-review-actions .wt-vote.on-up { background: var(--wt-navy-50); border-color: var(--wt-navy-100); color: var(--wt-navy); }
.wt-review-actions .wt-vote.on-down { background: var(--wt-wine-50); border-color: var(--wt-wine-100); color: var(--wt-wine); }
.wt-review-actions .wt-vote[disabled] { opacity: 0.55; cursor: not-allowed; }
.wt-comments { display: flex; flex-direction: column; }
.wt-thread { border-bottom: var(--wt-bw) solid var(--wt-border); padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.wt-comment { display: flex; flex-direction: column; gap: 6px; }
.wt-comment.is-reply { margin-left: 36px; padding: 12px 14px; background: var(--wt-light); border-radius: var(--wt-r-md); }
.wt-comment .wt-review-text { font-size: 14.5px; }

/* ---------- Auth / onboarding ---------- */
.wt-auth { min-height: calc(100vh - var(--wt-h-header)); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--wt-sp-7) 20px 80px; gap: var(--wt-sp-4); }
.wt-app.is-frozen .wt-auth { min-height: 0; padding-bottom: 96px; }
.wt-auth-card { width: 100%; max-width: 440px; background: var(--wt-card); border-radius: var(--wt-r-lg); padding: 40px 36px; border: var(--wt-bw) solid var(--wt-border); box-shadow: var(--wt-shadow-card); }
.wt-auth-card.onb { max-width: 560px; }
.wt-auth-card h1 { font-size: 24px; font-weight: var(--wt-fw-extrabold); letter-spacing: -0.025em; margin: 0 0 6px; line-height: var(--wt-lh-title); }
.wt-auth-card .sub { margin: 0 0 var(--wt-sp-5); color: var(--wt-muted); font-size: var(--wt-fs-sm); }
.wt-auth-btns { display: flex; flex-direction: column; gap: 10px; }
.wt-steps { display: flex; align-items: center; gap: var(--wt-sp-2); margin-bottom: var(--wt-sp-5); }
.wt-step { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--wt-muted); font-weight: var(--wt-fw-semibold); }
.wt-step > i { width: 24px; height: 24px; border-radius: 50%; background: var(--wt-light); color: var(--wt-muted); display: inline-grid; place-items: center; font-style: normal; font-family: var(--wt-mono); font-size: 12px; }
.wt-step.on { color: var(--wt-ink); }
.wt-step.on > i { background: var(--wt-ink); color: var(--wt-on-dark); }
.wt-step.done > i { background: var(--wt-navy); color: var(--wt-on-dark); }
.wt-step-line { flex: 1; height: 1px; background: var(--wt-border); border: 0; min-width: 12px; }
.wt-onb-body { display: flex; flex-direction: column; gap: var(--wt-sp-4); }
.wt-consent { display: flex; flex-direction: column; gap: 14px; }
.wt-consent .row { display: flex; align-items: center; gap: var(--wt-sp-2); }
.wt-consent .row .wt-check { flex: 1; }
.wt-consent .row a { font-size: 12.5px; color: var(--wt-muted); text-decoration: underline; text-underline-offset: 2px; }
.wt-onb-foot { display: flex; gap: var(--wt-sp-2); margin-top: var(--wt-sp-5); }
.wt-onb-foot .wt-btn { flex: 1; height: 46px; }
.wt-catgrid { display: flex; flex-wrap: wrap; gap: var(--wt-sp-2); }

/* ---------- Register form ---------- */
.wt-form-layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--wt-form-aside-w); gap: var(--wt-sp-7); margin-top: var(--wt-sp-6); align-items: start; }
.wt-form { display: flex; flex-direction: column; gap: var(--wt-sp-5); min-width: 0; }
.wt-fs { border: var(--wt-bw) solid var(--wt-border); background: var(--wt-card); border-radius: var(--wt-r-lg); padding: 24px 28px 28px; margin: 0; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.wt-fs > h2 { font-size: 17px; font-weight: var(--wt-fw-extrabold); margin: 0; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.wt-fs > h2 small { font-family: var(--wt-mono); font-size: 10.5px; font-weight: var(--wt-fw-medium); padding: 2px 6px; border-radius: 3px; background: var(--wt-wine-50); color: var(--wt-wine); }
.wt-fs > h2 small.opt { background: var(--wt-light); color: var(--wt-muted); }
.wt-cats { display: flex; flex-wrap: wrap; gap: var(--wt-sp-2); }
.wt-chip .order { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--wt-butter); color: var(--wt-ink); font-family: var(--wt-mono); font-size: 10px; font-weight: var(--wt-fw-bold); }
.wt-radio-card { display: flex; align-items: center; gap: 10px; border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); padding: 12px 14px; background: var(--wt-card); font-size: var(--wt-fs-sm); cursor: pointer; flex: 1; min-width: 150px; }
.wt-radio-card input { accent-color: var(--wt-navy); margin: 0; }
.wt-radio-card.on { border-color: var(--wt-navy); background: var(--wt-navy-50); }
.wt-radio-card small { display: block; color: var(--wt-muted); font-size: 12px; }
.wt-form-aside .sticky { position: sticky; top: var(--wt-sp-5); display: flex; flex-direction: column; gap: var(--wt-sp-4); }
.wt-app.is-frozen .wt-form-aside .sticky { position: static; }
.wt-progress { background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.wt-progress .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: var(--wt-fw-bold); }
.wt-progress .bar { height: 8px; background: var(--wt-light); border-radius: var(--wt-r-pill); overflow: hidden; display: flex; }
.wt-progress .bar > div { background: var(--wt-navy); }
.wt-progress ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--wt-muted); }
.wt-progress li { display: flex; align-items: center; gap: 6px; }
.wt-progress li.ok { color: var(--wt-navy); }
.wt-preview-label { font-size: 12px; font-weight: var(--wt-fw-bold); color: var(--wt-muted); font-family: var(--wt-mono); }
.wt-done { max-width: 720px; margin: 0 auto; padding: var(--wt-sp-7) 0 0; display: flex; flex-direction: column; align-items: center; gap: var(--wt-sp-5); text-align: center; }
.wt-done .wt-card { width: 320px; text-align: left; }
.wt-done .btns { display: flex; gap: var(--wt-sp-2); flex-wrap: wrap; justify-content: center; }
.wt-done-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--wt-navy-50); color: var(--wt-navy); display: grid; place-items: center; }

/* ---------- Manage ---------- */
.wt-manage { margin-top: var(--wt-sp-5); background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); overflow: hidden; }
.wt-manage-row { display: grid; grid-template-columns: minmax(0, 2.2fr) 150px minmax(0, 1.8fr) 96px 250px; gap: var(--wt-sp-4); align-items: center; padding: var(--wt-sp-4) 20px; border-top: 1px solid var(--wt-light); }
.wt-manage-th { font-size: 12.5px; font-weight: var(--wt-fw-bold); color: var(--wt-muted); padding-top: 12px; padding-bottom: 12px; background: #FBFAF7; border-top: 0; }
.wt-manage-svc { display: flex; gap: 14px; align-items: center; min-width: 0; }
.wt-manage-svc .txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.wt-manage-svc .txt a { font-weight: var(--wt-fw-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt-manage-svc .txt a:hover { text-decoration: underline; }
.wt-manage-svc .txt > span { font-size: 13px; color: var(--wt-text-quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt-manage-svc .vis { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--wt-text-sub); margin-top: 2px; }
.wt-manage-stats { display: flex; gap: var(--wt-sp-3); font-size: 13px; color: var(--wt-text-quiet); flex-wrap: wrap; align-items: center; }
.wt-manage-stats span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.wt-manage-date { font-family: var(--wt-mono); font-size: 12px; color: var(--wt-text-quiet); }
.wt-manage-act { display: flex; gap: 2px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.wt-manage-act .wt-btn { padding: 0 10px; }
.wt-reason { font-size: 12.5px; color: var(--wt-text-sub); display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; }
.wt-vers-list { display: flex; flex-direction: column; border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); margin: var(--wt-sp-4) 0; }
.wt-vers-list .wt-ver { padding: 12px 14px; grid-template-columns: 64px minmax(0, 1fr) auto; }
.wt-vers-list .acts { display: flex; gap: 2px; }
.wt-ver-form { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--wt-sp-2); }
.wt-ver-form .wt-textarea { grid-column: 1 / -1; min-height: 72px; }
.wt-ver-form .acts { grid-column: 1 / -1; display: flex; gap: var(--wt-sp-2); justify-content: flex-end; }

/* ---------- My page / profile ---------- */
.wt-me-head { display: flex; gap: var(--wt-sp-5); align-items: center; flex-wrap: wrap; padding: var(--wt-sp-6) 0 var(--wt-sp-5); }
.wt-me-head .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.wt-me-head h1 { margin: 0; font-size: 26px; font-weight: var(--wt-fw-extrabold); letter-spacing: -0.025em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wt-me-head h1 small { font-family: var(--wt-mono); font-size: 13px; color: var(--wt-muted); font-weight: var(--wt-fw-regular); }
.wt-me-head p { margin: 0; color: var(--wt-text-sub); font-size: var(--wt-fs-sm); }
.wt-links { display: flex; gap: var(--wt-sp-2); flex-wrap: wrap; margin-top: 6px; }
.wt-links button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--wt-r-pill); border: var(--wt-bw) solid var(--wt-border); background: var(--wt-card); font-size: 12.5px; color: var(--wt-text-sub); }
.wt-links button:hover { border-color: var(--wt-border-strong); color: var(--wt-ink); }
.wt-prof-nums { display: flex; gap: var(--wt-sp-5); margin-top: var(--wt-sp-3); font-size: var(--wt-fs-sm); color: var(--wt-muted); flex-wrap: wrap; }
.wt-prof-nums b { color: var(--wt-ink); font-weight: var(--wt-fw-extrabold); margin-right: 3px; }
.wt-mp-body { padding-top: var(--wt-sp-5); }
.wt-set-grid { display: flex; flex-direction: column; gap: var(--wt-sp-5); max-width: 720px; }
.wt-set-sec { background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); padding: 24px 28px; display: flex; flex-direction: column; gap: var(--wt-sp-4); }
.wt-set-sec h2 { margin: 0; font-size: var(--wt-fs-card); font-weight: var(--wt-fw-extrabold); }
.wt-set-sec.danger { border-color: var(--wt-wine-100); }
.wt-set-two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--wt-sp-4); }
.wt-withdraw ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--wt-text-sub); line-height: 1.7; }
.wt-myreview { display: flex; flex-direction: column; gap: 8px; padding: 18px 0; border-bottom: var(--wt-bw) solid var(--wt-border); }
.wt-myreview .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wt-myreview .head a { font-weight: var(--wt-fw-bold); }
.wt-myreview .head a:hover { text-decoration: underline; }

/* ---------- Docs ---------- */
.wt-doc { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--wt-sp-7); padding-top: var(--wt-sp-6); align-items: start; }
.wt-doc-toc { position: sticky; top: var(--wt-sp-5); display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.wt-app.is-frozen .wt-doc-toc { position: static; }
.wt-doc-toc button { background: none; border: 0; text-align: left; padding: 7px 10px; border-radius: 6px; color: var(--wt-text-sub); }
.wt-doc-toc button:hover { background: var(--wt-light); color: var(--wt-ink); }
.wt-doc-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: var(--wt-sp-5); }
.wt-doc-head .meta { display: flex; gap: var(--wt-sp-3); flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--wt-text-sub); }
.wt-doc-body section { margin-bottom: var(--wt-sp-5); }
.wt-doc-body h2 { font-size: 18px; font-weight: var(--wt-fw-extrabold); margin: 0 0 8px; }
.wt-doc-body p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.75; color: #3A3A3A; }

/* ---------- Responsive (컨테이너 쿼리) ---------- */
.show-sm { display: none !important; }
.wt-d-notice-m { display: none; }
@container app (max-width: 1180px) {
  .wt-grid { --cols: 3 !important; }
  .wt-d-top { grid-template-columns: 96px minmax(0, 1fr); }
  .wt-d-actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .wt-d-actions .wt-d-launch { width: auto; min-width: 240px; }
  .wt-d-notice, .wt-d-own-note { flex-basis: 100%; }
  .wt-manage-row { grid-template-columns: minmax(0, 2fr) 140px minmax(0, 1.6fr) 170px; }
  .wt-manage-row .wt-manage-date { display: none; }
  .wt-manage-th > :nth-child(4) { display: none; }
}
@container app (max-width: 860px) {
  .wt-wrap { padding: 0 20px; }
  .wt-grid { --cols: 2 !important; gap: var(--wt-sp-5) var(--wt-sp-4); }
  .hide-md { display: none !important; }
  .wt-hero-title { font-size: 32px; }
  .wt-d-body { grid-template-columns: 1fr; gap: var(--wt-sp-5); }
  .wt-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wt-info-grid > div:nth-child(3n+1) { border-left: 1px solid var(--wt-light); }
  .wt-info-grid > div:nth-child(2n+1) { border-left: 0; }
  .wt-info-grid > div:nth-child(3) { border-top: 1px solid var(--wt-light); }
  .wt-form-layout { grid-template-columns: 1fr; gap: var(--wt-sp-5); }
  .wt-form-aside { order: 2; }
  .wt-form-aside .sticky { position: static; }
  .wt-doc { grid-template-columns: 1fr; }
  .wt-doc-toc { position: static; flex-direction: row; flex-wrap: wrap; }
  .wt-manage { background: transparent; border: 0; display: flex; flex-direction: column; gap: var(--wt-sp-3); }
  .wt-manage-th { display: none; }
  .wt-manage-row { grid-template-columns: 1fr auto; background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-md); padding: 14px; gap: var(--wt-sp-3); }
  .wt-manage-svc { grid-column: 1 / -1; }
  .wt-manage-stats { grid-column: 1 / -1; order: 3; }
  .wt-manage-act { order: 4; grid-column: 1 / -1; justify-content: flex-start; border-top: 1px solid var(--wt-light); padding-top: 10px; }
  .wt-set-two { grid-template-columns: 1fr; }
}
@container app (max-width: 560px) {
  .wt-app { font-size: 14px; }
  .wt-wrap { padding: 0 var(--wt-sp-4); }
  .wt-grid { --cols: 1 !important; gap: 20px; }
  .wt-grid.m2 { --cols: 2 !important; gap: var(--wt-sp-4) var(--wt-sp-3); }
  .wt-grid.m2 .wt-card-body { padding: 12px 12px 10px; }
  .wt-grid.m2 .wt-card-foot { padding: 8px 12px; }
  .wt-grid.m2 .wt-card-title { font-size: 14.5px; }
  .wt-grid.m2 .wt-card-desc { font-size: 12.5px; }
  .wt-grid.m2 .wt-card-foot .wt-tag { display: none; }
  .hide-sm { display: none !important; }
  .wt-header-in { height: 56px; gap: 4px; }
  .wt-logo { font-size: 20px; }
  .wt-nav { height: 46px; gap: 0; }
  .wt-nav-tab { font-size: var(--wt-fs-body); padding: 0 10px; height: 46px; }
  .wt-sec { margin-top: 40px; }
  .wt-sec-title { font-size: 19px; }
  .wt-page-title { font-size: 23px; }
  .wt-hero { padding: 32px 0 0; text-align: left; }
  .wt-hero-title { font-size: 25px; }
  .wt-hero-sub { font-size: var(--wt-fs-sm); }
  .wt-search { height: 52px; padding-left: 18px; }
  .wt-search input { font-size: var(--wt-fs-body); }
  .wt-search-go { width: 38px; height: 38px; }
  .wt-search-hint { display: none; }
  .wt-search-ex { justify-content: flex-start; }
  .wt-search-ex button { text-align: left; }
  .wt-interest { justify-content: flex-start; }
  .wt-card-launch, .wt-li .wt-card-launch { display: none; }
  .wt-card-rating { opacity: 1; }
  .wt-li { grid-template-columns: 48px minmax(0, 1fr); gap: var(--wt-sp-2) var(--wt-sp-3); }
  .wt-li-stats { grid-column: 2; }
  .wt-li-side { grid-column: 2; justify-content: flex-start; min-width: 0; }
  .wt-btn { height: 34px; padding: 0 var(--wt-sp-3); font-size: 13px; }
  .wt-btn-lg { height: var(--wt-h-btn-lg); font-size: var(--wt-fs-body); }
  .wt-mobile-only { display: flex; }
  .wt-fgroup { grid-template-columns: 1fr; gap: 6px; }
  .wt-fgroup > b { line-height: 1.4; }
  .wt-filter { padding: var(--wt-sp-2) var(--wt-sp-4); }
  .wt-d-top { grid-template-columns: 1fr; gap: var(--wt-sp-4); }
  .wt-d-actions { display: none; }
  .show-sm { display: inline-grid !important; }
  .wt-d-notice-m { display: block; }
  .wt-d-title { font-size: 26px; }
  .wt-d-tagline { font-size: var(--wt-fs-body); }
  .wt-d-stats { grid-template-columns: repeat(3, 1fr); }
  .wt-d-stats > div:nth-child(n+4) { border-top: var(--wt-bw) solid var(--wt-border); }
  .wt-d-stats > div:nth-child(4) { border-left: 0; }
  .wt-d-stat-v { font-size: var(--wt-fs-card); }
  .wt-shot.wide { height: 168px; }
  .wt-shot.tall { height: 280px; }
  .wt-crumb { padding: var(--wt-sp-4) 0 20px; }
  .wt-rv-summary { grid-template-columns: 1fr; gap: var(--wt-sp-3); }
  .wt-review-reply, .wt-reply-form { margin-left: 16px; }
  .wt-comment.is-reply { margin-left: 16px; }
  .wt-catbar { justify-content: flex-start; }
  .wt-fs { padding: 20px var(--wt-sp-4); }
  .wt-auth { padding: var(--wt-sp-5) var(--wt-sp-4) 60px; justify-content: flex-start; }
  .wt-auth-card { padding: 28px 22px; }
  .wt-me-head { gap: var(--wt-sp-4); }
  .wt-prof-nums { gap: 14px; font-size: 13px; }
  .wt-set-sec { padding: 20px var(--wt-sp-4); }
  .wt-footer-in { flex-direction: column; }
  .wt-up-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wt-up-grid.tall { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .tw-fab { bottom: 76px; right: 12px; height: 34px; padding: 0 12px; font-size: 12px; }
  .tw-panel { right: 8px; bottom: 120px; width: calc(100vw - 16px); max-height: calc(100vh - 150px); }
  .wt-modal-wrap { place-items: end center; padding: 0; }
  .wt-modal { border-radius: var(--wt-r-lg) var(--wt-r-lg) 0 0; max-width: none; }
  .wt-toast { white-space: normal; }
}

/* ---------- Tweaks 데모 패널 (보드·단일 프레임에서는 렌더하지 않음) ---------- */
.tw-fab { position: fixed; right: 16px; bottom: 16px; z-index: 80; height: 40px; padding: 0 16px; border-radius: var(--wt-r-pill); border: 0; background: var(--wt-ink); color: var(--wt-on-dark); font-size: 13px; font-weight: var(--wt-fw-semibold); display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--wt-shadow-pop); }
.tw-panel { position: fixed; right: 16px; bottom: 64px; z-index: 80; width: 300px; max-height: calc(100vh - 96px); overflow-y: auto; background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); border-radius: var(--wt-r-lg); box-shadow: var(--wt-shadow-pop); padding: var(--wt-sp-4); display: flex; flex-direction: column; gap: 14px; font-size: 13px; }
.tw-panel h4 { margin: 0; font-size: 12px; letter-spacing: 0.04em; color: var(--wt-muted); font-family: var(--wt-mono); font-weight: var(--wt-fw-medium); }
.tw-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--wt-light); }
.tw-sec:first-of-type { border-top: 0; padding-top: 0; }
.tw-sec > label { font-weight: var(--wt-fw-semibold); display: flex; flex-direction: column; gap: 4px; }
.tw-row { display: flex; gap: 4px; flex-wrap: wrap; }
.tw-row button { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border-radius: 6px; border: var(--wt-bw) solid var(--wt-border); background: var(--wt-card); font-size: 12px; font-weight: var(--wt-fw-semibold); color: var(--wt-text-sub); }
.tw-row button.on { background: var(--wt-ink); color: var(--wt-on-dark); border-color: var(--wt-ink); }
.tw-panel select { width: 100%; height: 32px; border: var(--wt-bw) solid var(--wt-border); border-radius: 6px; padding: 0 8px; font-size: 12.5px; background: var(--wt-card); }
.tw-note { font-size: 11.5px; color: var(--wt-muted); line-height: 1.5; margin: 0; }

/* ---------- 화면 보드 (#board) ---------- */
body.is-board { background: var(--wt-board-bg); }
.bd-page { padding: 0 40px 160px; min-width: 0; }
.bd-top { padding: 32px 0 24px; display: flex; flex-direction: column; gap: var(--wt-sp-4); }
.bd-top h1 { margin: 0; font-size: 22px; font-weight: var(--wt-fw-extrabold); letter-spacing: var(--wt-ls-tight); }
.bd-top p { margin: 0; font-size: 13px; color: var(--wt-text-sub); max-width: 920px; line-height: 1.6; }
.bd-toc { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.bd-toc .grp { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.bd-toc .grp > b { min-width: 112px; font-size: 12px; font-family: var(--wt-mono); color: var(--wt-ink); font-weight: var(--wt-fw-bold); }
.bd-toc a { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--wt-r-pill); background: var(--wt-card); border: var(--wt-bw) solid var(--wt-border); font-size: 12px; color: var(--wt-text-sub); font-family: var(--wt-mono); }
.bd-toc a:hover { border-color: var(--wt-border-strong); color: var(--wt-ink); }
.bd-toc a.on { background: var(--wt-ink); color: var(--wt-on-dark); border-color: var(--wt-ink); }
.bd-err { background: var(--wt-wine-50); color: var(--wt-wine); border: var(--wt-bw) solid var(--wt-wine-100); border-radius: var(--wt-r-md); padding: 10px 14px; font-size: 13px; }
.bd-stack { display: flex; flex-direction: column; gap: var(--wt-board-gap); align-items: flex-start; padding-top: 48px; }
.bd-item { display: flex; flex-direction: column; gap: var(--wt-sp-3); min-width: 0; }
.bd-label { display: flex; gap: var(--wt-sp-3); align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--wt-ink); }
.bd-label code { font-family: var(--wt-mono); font-size: 12px; font-weight: var(--wt-fw-bold); background: var(--wt-ink); color: var(--wt-on-dark); padding: 2px 8px; border-radius: var(--wt-r-sm); }
.bd-label span { color: var(--wt-text-sub); }
.bd-label em { font-style: normal; font-family: var(--wt-mono); font-size: 11.5px; color: var(--wt-muted); }
.bd-frame { background: var(--wt-bg-page); border: var(--wt-bw) solid var(--wt-border); position: relative; }
.bd-frame.area { padding: var(--wt-sp-5); }
.bd-frame.overlay { background: var(--wt-bg-page); }
.bd-embed { position: relative; display: block; overflow: hidden; }

/* 평가 등급 — R-REVIEW. 추천+비추천 0이면 0으로 나누지 않고 「평가 수 부족」.
   소수점 비율은 정수로 반올림한 뒤 구간을 비교한다(구간 공백 방지, 제안 처리 · 확인 필요). */
function ratingOf(pos, neg) {
  const n = pos + neg;
  if (n < POLICY.reviewMinForGrade) return { key: 'low', label: RATING_LABEL.low, pct: n ? Math.round((pos / n) * 100) : null, n, pos, neg };
  const pct = Math.round((pos / n) * 100);
  let key;
  if (n < POLICY.gradeManyFrom) key = pct >= 80 ? 'pos' : pct <= 19 ? 'neg' : 'mixed';
  else key = pct >= 80 ? 'vpos' : pct >= 70 ? 'mpos' : pct >= 40 ? 'mixed' : pct >= 20 ? 'mneg' : 'vneg';
  return { key, label: RATING_LABEL[key], pct, n, pos, neg };
}

    if (l.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {

      continue;
    }
    if (listRe.test(l)) {

/* ---------- 입력 검증 규칙 ---------- */
const URL_SAMPLES = [
  ['idle', '입력 전', ''],
  ['format', '형식 오류', 'http://my-service.example.com'],
  ['source', '소스 보관 사이트', 'https://github.com/example-dawn/my-service'],
  ['dup', '중복', 'https://dungi-game.example.com'],
  ['unreach', '접속 불가', 'https://offline.example.com'],
  ['ok', '접속 가능', 'https://my-service.example.com'],
];
const SOURCE_HOSTS = ['github.com', 'gitlab.com', 'bitbucket.org', 'www.github.com'];
/* 형식 검사는 클라이언트에서 즉시, 접속 가능·중복은 샘플 규칙으로 시연(실제 네트워크·서버 검사가 아님) */
function checkUrlFormat(v) {
  const t = (v || '').trim();
  if (!t) return { code: 'idle' };
  if (!/^https:\/\//i.test(t)) return { code: 'invalid', sub: 'format' };
  let u; try { u = new URL(t); } catch (e) { return { code: 'invalid', sub: 'format' }; }
  if (!u.hostname.includes('.')) return { code: 'invalid', sub: 'format' };
  if (SOURCE_HOSTS.includes(u.hostname.toLowerCase())) return { code: 'invalid', sub: 'source' };
  return { code: 'checking' };
}
function checkUrlRemote(A, v, selfId) {
  const t = v.trim().replace(/\/+$/, '').toLowerCase();
  const dup = A.st.services.some((s) => s.id !== selfId && !s.off && s.url.replace(/\/+$/, '').toLowerCase() === t);
  if (dup) return { code: 'dup' };
  let host = ''; try { host = new URL(t).hostname; } catch (e) { /* noop */ }
  if (/^(offline|down|unreachable)\./.test(host) || host.startsWith('no-site')) return { code: 'unreach' };
  return { code: 'ok' };
}
const URL_MSG = {
  idle: ['', 'info', 'https:// 로 시작하는 서비스 주소를 입력하세요. 등록할 때 접속 가능 여부를 검사해요.'],
  checking: ['wait', 'loader', '주소를 확인하는 중이에요…'],
  ok: ['ok', 'check', '접속할 수 있는 주소예요.'],

/* 리뷰 자체에 대한 추천·비추천(서비스 평가 집계와 무관). 회원만, 본인 리뷰 제외, 한 리뷰에 한 번(바꾸기·취소 가능) */

  return `<span class="wt-votes" role="group" aria-label="이 리뷰에 대한 반응">${b('up', '추천', 'thumbUp', r.up)}${b('down', '비추천', 'thumbDown', r.down)}</span>`;

/* ---------- 댓글 (평가·집계와 무관 · 추천/비추천 없음 · 신고 가능 · 서비스별 익명 허용 설정) ---------- */
function commentItem(A, c, s, o = {}) {

  return `<article class="wt-comment${o.reply ? ' is-reply' : ''}" data-cid="${c.id}"><div class="wt-review-head">${av}<b>${esc(name)}</b>${ownerTag ? '<span class="wt-rv-who owner">제작자</span>' : ''}${anon ? '<span class="wt-rv-who anon">익명</span>' : ''}${mine ? '<span class="wt-rv-who">내 댓글</span>' : ''}<span class="date">${fmtDate(c.date)}</span></div>
    <p class="${c.deleted ? 'wt-review-text wt-muted' : 'wt-review-text'}">${c.deleted ? '삭제된 댓글입니다.' : esc(c.text)}</p><div class="wt-review-actions">${act}</div></article>`;
}
function commentComposer(A, s, o = {}) {

function commentThread(A, s) {

      <div style="display:flex;gap:8px;align-items:center;justify-content:flex-end">${s.allowCommentAnon ? `<label class="wt-check" style="margin-right:auto"><input type="checkbox" data-chg="cmReplyAnon"${d.cmReplyAnon ? ' checked' : ''}>익명</label>` : ''}<button type="button" class="wt-btn wt-btn-ghost wt-btn-sm" data-act="cmReplyCancel">취소</button><button type="button" class="wt-btn wt-btn-primary wt-btn-sm" data-act="cmReplySubmit" data-id="${c.id}">답글 등록</button></div></div>` : '';

/* ===== pages.js ===== */
/* =========================================================
   WEBTER — 화면(페이지) 렌더러. 각 함수는 <main> 안쪽 HTML 문자열을 돌려준다.

const catLinks = (s) => s.cats.map((c, i) => `<a class="wt-tag${i === 0 ? ' main' : ''}" href="#latest?cat=${c}"${i === 0 ? ' title="대표 카테고리"' : ''}>${esc(CAT_LABEL[c])}</a>`).join('');
const ownerOf = (A, s) => A.st.users[s.owner];

const withReason = (items) => items;

/* ---------- 공통: 서비스 모음을 카드형/목록형으로 ---------- */
function renderServices(A, entries, o = {}) {
  // entries: [{s, reason?}]
  if (A.s.view === 'list' && !o.card) return listStack(entries.map((e, i) => serviceListItem(A, e.s, { rank: o.rank ? i + 1 : null, reason: e.reason })));
  return cardGrid(A, entries.map((e, i) => serviceCard(A, e.s, { rank: o.rank ? i + 1 : null, reason: e.reason })), { m2: A.narrow, cols: o.cols });

const availOnly = (A) => publicServices(A.st).filter((s) => s.avail === 'on');

/* ---------- 01 홈 ---------- */
function interestSort(list, interests) {
  if (!interests || !interests.length) return list;
  const hit = list.filter((s) => s.cats.some((c) => interests.includes(c)));
  return [...hit, ...list.filter((s) => !hit.includes(s))];
}
function homePage(A) {

/* ---------- 02 트렌딩 / 03 인기 / 04 최신 (+ 05 공통 필터) ---------- */
const PERIOD_LABEL = { week: '주간', month: '월간', all: '전체' };

function filterToolbar(A, count, o = {}) {

/* ---------- 06 검색 결과 ---------- */
function searchHead(A, S) {
  const quota = `<span class="wt-quota">오늘 남은 AI 검색 ${S.left}/${S.limit}회 — 비회원 ${POLICY.aiLimitGuest}회, 회원 ${POLICY.aiLimitMember}회</span>`;
  if (S.mode === 'ai') return `<div class="wt-ai-box" data-ai="result"><h3>${I('spark', 18)}AI가 의도를 분석해 찾은 서비스</h3>
      <div class="row"><span class="wt-help" style="margin-right:4px">해석한 조건</span>${S.chips.map((c) => `<span class="wt-chip sm fixed">${esc(c)}</span>`).join('')}</div>${quota}</div>`;
  if (S.mode === 'exhausted') return `<div class="wt-ai-box" data-ai="exhausted"><h3>${I('info', 18)}오늘 AI 검색 횟수를 모두 사용했어요</h3><div class="wt-help" style="font-size:13.5px">내일 다시 사용할 수 있어요. 지금은 일반 검색(서비스 이름·소개·태그에 검색어 포함)으로 보여 드려요.</div>${quota}</div>`;
  return '';
}
function searchPage(A) {
  const S = A.s.search; const q = S.q;
  let entries;
  const pubs = publicServices(A.st);
  if (!q.trim()) entries = [];
  else if (S.mode === 'ai') entries = S.items.map((it) => ({ s: svcById(A.st, it.id), reason: it.reason })).filter((e) => e.s);
  else entries = keywordMatch(pubs, q).map((s) => ({ s }));
  entries = entries.filter((e) => applyFilters([e.s], A.s.filters, A.narrow).length);
  const sort = A.s.searchSort;
  if (!(S.mode === 'ai' && sort === 'relevance')) {
    const order = sortBy(entries.map((e) => e.s), sort === 'popular' ? 'month' : sort === 'latest' ? 'latest' : 'relevance', A.st, q);
    entries = order.map((s) => entries.find((e) => e.s === s));
  }
  const top = `<div class="wt-search-top">${searchBar(A, { q })}</div>`;
  const head = searchHead(A, S);
  const sortSel = selectBox(`${A.uid}-sort`, '정렬', sort, [['relevance', '관련도순'], ['popular', '인기순'], ['latest', '최신순']], 'setSearchSort');
  const title = q.trim() ? `<h1 class="wt-page-title" style="font-size:22px">‘${esc(q)}’ 검색 결과 <span class="wt-mono" style="font-size:15px;color:var(--wt-muted);font-weight:400">${entries.length}개</span></h1>` : `<h1 class="wt-page-title" style="font-size:22px">검색</h1>`;
  let body;
  if (!q.trim()) body = emptyState('검색어를 입력해 보세요', '키워드나 문장으로 찾을 수 있어요.', exampleChips(A));
  else if (!entries.length) body = `<div class="wt-empty" style="padding-bottom:var(--wt-sp-5)"><b>‘${esc(q)}’에 맞는 서비스를 찾지 못했어요</b><span>다른 키워드로 검색하거나 필터를 줄여 보세요. 아래 인기 서비스를 둘러볼 수도 있어요.</span></div>

/* ---------- 이벤트 연결 (인스턴스당 1회) ---------- */
function bindApp(A) {
  const run = async (name, el, ev) => {
    const fn = ACT[name]; if (!fn) return;
    const r = await fn(A, el, ev);
    if (r !== false) A.render();
  };
  A.root.addEventListener('click', (ev) => {
    const t = ev.target;
    if (A.s.profileOpen && !t.closest('.wt-pop-wrap')) { A.s.profileOpen = false; if (!t.closest('[data-act]') && !t.closest('a')) A.render(); }
    const act = t.closest('[data-act]');
    if (act && !act.disabled && act.getAttribute('aria-disabled') !== 'true') {
      if (act.tagName === 'A') ev.preventDefault();
      const name = act.dataset.act; if (name === 'overlayBg' && ev.target !== act) return;
      if (['fld', 'rvAnon', 'consent', 'consentAll', 'imgPick', 'pratioSet', 'pfitSet', 'reportReason', 'statusSelect'].includes(name)) return;
      run(name, act, ev); return;
    }
    const a = t.closest('a[href^="#"]');
    if (a && a.getAttribute('href') === location.hash) { ev.preventDefault(); A.applyRoute(parseRoute(location.hash)); A.render(); }
  });
  const onEvt = (type, attr) => (ev) => {
    const el = ev.target.closest(`[${attr}]`); if (!el) return;
    if (type === 'input' && ev.isComposing && el.tagName !== 'TEXTAREA' && el.tagName !== 'INPUT') return;
    run(el.getAttribute(attr), el, ev);
  };
  A.root.addEventListener('input', onEvt('input', 'data-inp'));
  A.root.addEventListener('change', onEvt('change', 'data-chg'));
  A.root.addEventListener('submit', (ev) => {
    const f = ev.target.closest('[data-form]'); if (!f) return; ev.preventDefault();
    const k = f.dataset.form;
    if (k === 'search') { const v = f.querySelector('input[name="q"]').value.trim(); A.go('#search?q=' + encodeURIComponent(v)); }
    else if (k === 'register') run('regSubmit', f, ev);
  });
  A.root.addEventListener('keydown', (ev) => {
    const el = ev.target;
    if (ev.key === 'Enter' && el.dataset && el.dataset.enter && !ev.isComposing) { ev.preventDefault(); run(el.dataset.enter, el, ev); return; }
    if (ev.key === 'Enter' && el.tagName === 'INPUT' && el.closest('[data-form="register"]') && el.type !== 'submit') ev.preventDefault();
    if (ev.key === 'Escape') {
      if (A.s.overlay) { A.s.overlay = null; A.render(); } else if (A.s.side) { A.s.side = false; A.render(); } else if (A.s.profileOpen) { A.s.profileOpen = false; A.render(); }
    }
  });
}
