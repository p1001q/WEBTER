<script type="text/babel">/* WEBTER — 앱 상태 + 라우팅 + Tweaks */

const WT_PAGES = {
  home: HomePage, trending: TrendingPage, popular: PopularPage, latest: LatestPage, follow: FollowPage,
  category: CategoryPage, search: SearchPage, detail: DetailPage, login: LoginPage, signup: SignupPage,
  register: RegisterPage, manage: ManagePage, edit: EditPage, mypage: MyPage, profile: ProfilePage,
};
const WT_AUTH_ONLY = new Set(['follow', 'register', 'manage', 'edit', 'mypage']);

const WT_SCREENS = [
  ['01 홈', 'home', {}], ['02 트렌딩', 'trending', {}], ['03 인기', 'popular', {}], ['04 최신', 'latest', {}],
  ['05 팔로우 피드', 'follow', {}], ['06 AI 검색 결과', 'search', { q: '친구랑 가볍게 할 수 있는 웹게임' }],
  ['07 서비스 상세', 'detail', { id: 's01' }], ['08 로그인', 'login', {}], ['09 회원가입', 'signup', {}],
  ['10 웹 서비스 등록', 'register', {}], ['11 내 서비스 관리', 'manage', {}], ['12 웹 서비스 수정', 'edit', { id: 's10' }],
  ['13 마이페이지', 'mypage', {}], ['14 공개 프로필', 'profile', { id: 'u_bori' }], ['+ 카테고리', 'category', { cat: 'game' }],
];

function parseHash() {
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h) return null;
  const [name, arg] = h.split('/');
  if (!WT_PAGES[name]) return null;
  const params = {};
  if (arg) { if (name === 'search') params.q = arg; else if (name === 'category') params.cat = arg; else params.id = arg; }
  return { name, params };
}
function routeHash(r) {
  const p = r.params || {};
  const arg = p.q || p.cat || p.id;
  return '#' + r.name + (arg ? '/' + encodeURIComponent(arg) : '');
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "viewport": "desktop",
  "cols": 4,
  "showBanner": true,
  "cardStatus": true,
  "showReason": true,
  "showStory": true,
  "showLevel": true,
  "showScope": true,
  "primary": "#35445C"
}/*EDITMODE-END*/;

function useStoredSet(key, init) {
  const [v, setV] = useState(() => { try { const s = JSON.parse(localStorage.getItem(key)); return new Set(s || init); } catch { return new Set(init); } });
  useEffect(() => { localStorage.setItem(key, JSON.stringify([...v])); }, [v]);
  return [v, setV];
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState(() => parseHash() || (() => { try { return JSON.parse(localStorage.getItem('wt_route')) || { name: 'home', params: {} }; } catch { return { name: 'home', params: {} }; } })());
  const [loggedIn, setLoggedIn] = useState(() => localStorage.getItem('wt_login') === '1');
  const [meOverride, setMeOverride] = useState({});
  const [likes, setLikes] = useStoredSet('wt_likes', ['s04']);
  const [scraps, setScraps] = useStoredSet('wt_scraps', ['s02', 's12', 's07']);
  const [follows, setFollows] = useStoredSet('wt_follows', ['u_bori', 'u_mint', 'u_pixel']);
  const [services, setServices] = useState(WT_SERVICES);
  const [extraReviews, setExtraReviews] = useState([{ id: 'mr1', sid: 's01', user: WT_ME_ID, date: '2026-10-13', text: '동아리 MT 때 다 같이 돌려 가며 했어요. 대기 화면에 다음 게임 미리보기가 있으면 좋겠어요!' }]);
  const [side, setSide] = useState(false);
  const [loginPrompt, setLoginPrompt] = useState(null);
  const [launching, setLaunching] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const scrollRef = useRef(null);
  const pending = useRef(null);
  const [winW, setWinW] = useState(window.innerWidth);
  useEffect(() => { const h = () => setWinW(window.innerWidth); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);

  const me = loggedIn ? { ...WT_USERS[WT_ME_ID], ...meOverride } : null;
  const mobile = tweaks.viewport === 'mobile';
  const narrow = mobile || winW < 560;

  useEffect(() => { localStorage.setItem('wt_login', loggedIn ? '1' : '0'); }, [loggedIn]);
  useEffect(() => {
    localStorage.setItem('wt_route', JSON.stringify(route));
    try { history.replaceState(null, '', routeHash(route)); } catch (e) {}
  }, [route]);
  useEffect(() => { const h = () => { const r = parseHash(); if (r) setRoute(r); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  useEffect(() => { document.documentElement.style.setProperty('--wt-navy', tweaks.primary); }, [tweaks.primary]);

  const scrollTop = () => { if (scrollRef.current) scrollRef.current.scrollTop = 0; window.scrollTo(0, 0); };
  const toastT = useRef(null);
  const toast = (msg, action, onAction) => { setToastMsg({ msg, action, onAction, k: Date.now() }); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToastMsg(null), 2600); };

  const go = (name, params = {}) => {
    if (WT_AUTH_ONLY.has(name) && !loggedIn) { pending.current = { name, params }; setRoute({ name: 'login', params: {} }); scrollTop(); return; }
    setRoute({ name, params }); setSide(false); scrollTop();
  };
  const requireLogin = (fn, reason) => { if (loggedIn) fn(); else setLoginPrompt({ reason, fn }); };
  const finishLogin = () => {
    setLoggedIn(true);
    const p = pending.current; pending.current = null;
    if (p) { setRoute(p); } else if (route.params.back) { setRoute(route.params.back); } else { setRoute({ name: 'home', params: {} }); }
    scrollTop();
  };

  const ctx = {
    tweaks, route, go, me, narrow, services, likes, scraps, follows, side, setSide, toast,
    requireLogin,
    login: (nick) => { if (nick) setMeOverride(o => ({ ...o, nick })); finishLogin(); },
    quickLogin: () => { setLoggedIn(true); toast('로그인 상태로 전환했어요 (데모)'); },
    logout: () => { setLoggedIn(false); setRoute({ name: 'home', params: {} }); toast('로그아웃했어요'); },
    updateMe: (p) => setMeOverride(o => ({ ...o, ...p })),
    toggleLike: (id) => requireLogin(() => setLikes(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; }), '좋아요는 로그인한 회원만 누를 수 있어요.'),
    toggleScrap: (id) => requireLogin(() => {
      const had = scraps.has(id);
      setScraps(s => { const n = new Set(s); had ? n.delete(id) : n.add(id); return n; });
      if (!had) toast('스크랩했어요', '스크랩 목록 보기', () => { setToastMsg(null); go('mypage', { tab: 'scrap' }); });
      else toast('스크랩을 해제했어요');
    }, '스크랩한 서비스는 마이페이지에서 다시 볼 수 있어요.'),
    toggleFollow: (uid) => requireLogin(() => {
      const had = follows.has(uid);
      setFollows(s => { const n = new Set(s); had ? n.delete(uid) : n.add(uid); return n; });
      if (!had) toast(`${WT_USERS[uid].nick}님을 팔로우했어요`, '팔로우 피드', () => { setToastMsg(null); go('follow'); });
    }, '팔로우하면 새 서비스를 팔로우 피드에서 볼 수 있어요.'),
    launch: (s) => { if (s.status !== 'live') return; setServices(list => list.map(x => x.id === s.id ? { ...x, clicks: x.clicks + 1 } : x)); setLaunching(s); },
    reviewsFor: (sid) => {
      const seed = WT_REVIEWS_SEED[sid] || WT_GENERIC_REVIEWS.slice(0, (sid.charCodeAt(2) % 3) + (services.find(s => s.id === sid)?.likes ? 1 : -1)).map((r, i) => ({ ...r, id: sid + 'g' + i, date: '2026-10-0' + (8 - i * 2) }));
      return [...extraReviews.filter(r => r.sid === sid).reverse(), ...seed];
    },
    allReviews: () => extraReviews,
    addReview: (sid, text) => setExtraReviews(r => [...r, { id: 'r' + Date.now(), sid, user: WT_ME_ID, date: '2026-10-15', text, fresh: true }]),
    addService: (f) => {
      const id = 'n' + Date.now();
      const kinds = ['poll', 'calendar', 'study', 'books'];
      const s = { id, name: f.name, tagline: f.tagline, desc: f.desc, cat: f.cat, owner: WT_ME_ID, likes: 0, scraps: 0, clicks: 0, status: f.status, created: '2026-10-15', trend: 0, tags: f.tags, features: ['상세 기능은 개발자가 추가할 수 있어요'], audience: '—', stack: ['—'], thumb: { kind: kinds[services.length % 4], bg: '#EAE7DF', a: '#35445C', b: '#F2DB94' } };
      setServices(l => [s, ...l]); return id;
    },
    updateService: (id, p) => setServices(l => l.map(s => s.id === id ? { ...s, ...p } : s)),
    removeService: (id) => setServices(l => l.filter(s => s.id !== id)),
  };

  let name = route.name;
  if (WT_AUTH_ONLY.has(name) && !loggedIn) name = 'login';
  const Page = WT_PAGES[name] || HomePage;
  const isAuth = name === 'login' || name === 'signup';

  const app = (
    <div className={'wt-app route-' + name + (tweaks.showScope ? '' : ' hide-scope')}>
      {isAuth ? (
        <header className="wt-header"><div className="wt-wrap wt-header-in">
          <button className="wt-iconbtn" onClick={() => setSide(true)} style={{ marginLeft: -8 }} aria-label="사이드바 열기"><Icon name="menu" size={22} /></button>
          <Wordmark onClick={() => go('home')} />
          <div className="wt-header-right"><button className="wt-btn wt-btn-ghost" onClick={() => go('home')}>둘러보기</button></div>
        </div></header>
      ) : <Header />}
      <main key={name + JSON.stringify(route.params)} className="wt-page-enter"><Page /></main>
      <Sidebar />
      {loginPrompt && <LoginPromptModal reason={loginPrompt.reason} onClose={() => setLoginPrompt(null)} />}
      {launching && <LaunchModal s={launching} onClose={() => setLaunching(null)} />}
      {toastMsg && <Toast key={toastMsg.k} msg={toastMsg.msg} action={toastMsg.action} onAction={toastMsg.onAction} />}
    </div>
  );

  return (
    <WtCtx.Provider value={ctx}>
      {mobile ? (
        <div className="wt-mobile-stage">
          <div className="wt-mobile-frame">
            <div className="wt-mobile-scroll" ref={scrollRef}>{app}</div>
          </div>
          <div className="wt-mobile-cap">모바일 390 × 844 미리보기</div>
        </div>
      ) : app}

      <TweaksPanel title="Tweaks">
        <TweakSection label="화면 바로가기">
          <TweakSelect label="화면" value={WT_SCREENS.findIndex(([, n]) => n === route.name)}
            options={WT_SCREENS.map(([l], i) => ({ value: i, label: l }))}
            onChange={(i) => { const [, n, p] = WT_SCREENS[+i]; if (WT_AUTH_ONLY.has(n) && !loggedIn) setLoggedIn(true); setRoute({ name: n, params: p }); setSide(false); scrollTop(); }} />
          <TweakToggle label="로그인 상태" value={loggedIn} onChange={(v) => setLoggedIn(v)} />
          <TweakButton label="사이드바 열기" secondary onClick={() => setSide(true)} />
        </TweakSection>
        <TweakSection label="뷰포트">
          <TweakRadio label="미리보기" value={tweaks.viewport} options={[{ value: 'desktop', label: '데스크톱' }, { value: 'mobile', label: '모바일 390' }]} onChange={(v) => setTweak('viewport', v)} />
          <TweakRadio label="카드 열 수" value={String(tweaks.cols)} options={[{ value: '3', label: '3열' }, { value: '4', label: '4열' }]} onChange={(v) => setTweak('cols', +v)} />
        </TweakSection>
        <TweakSection label="구성 요소">
          <TweakToggle label="홈 추천 배너" value={tweaks.showBanner} onChange={(v) => setTweak('showBanner', v)} />
          <TweakToggle label="카드 배포 상태 배지" value={tweaks.cardStatus} onChange={(v) => setTweak('cardStatus', v)} />
          <TweakToggle label="AI 추천 이유 표시" value={tweaks.showReason} onChange={(v) => setTweak('showReason', v)} />
        </TweakSection>
        <TweakSection label="확장 기능 노출">
          <TweakToggle label="제작 이야기 탭" value={tweaks.showStory} onChange={(v) => setTweak('showStory', v)} />
          <TweakToggle label="레벨 배지" value={tweaks.showLevel} onChange={(v) => setTweak('showLevel', v)} />
          <TweakToggle label="검토·확장 라벨" value={tweaks.showScope} onChange={(v) => setTweak('showScope', v)} />
        </TweakSection>
        <TweakSection label="Primary 컬러 (임시)">
          <TweakColor label="Primary" value={tweaks.primary} options={['#35445C', '#2F4A45', '#242424']} onChange={(v) => setTweak('primary', v)} />
        </TweakSection>
      </TweaksPanel>
    </WtCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
