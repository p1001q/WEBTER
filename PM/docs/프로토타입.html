<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WEBTER 웹터 — 웹에서 놀다, 웹터.</title>
<style>/* =========================================================
   WEBTER design tokens — 초기 시안 (변경 가능)
   ========================================================= */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --wt-navy: #35445C;
  --wt-navy-700: #2A3749;
  --wt-navy-50: #EBEEF3;
  --wt-ink: #242424;
  --wt-ivory: #F7F5EF;
  --wt-butter: #F2DB94;
  --wt-butter-50: #FBF3D9;
  --wt-wine: #823F43;
  --wt-wine-50: #F4E7E6;
  --wt-card: #FFFFFF;
  --wt-border: #E7E5DF;
  --wt-muted: #858585;
  --wt-light: #F1F1EE;

  --wt-font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --wt-mono: 'JetBrains Mono', ui-monospace, monospace;

  --wt-r-sm: 4px;
  --wt-r-md: 8px;
  --wt-r-lg: 12px;
  --wt-r-pill: 999px;

  --wt-shadow-card: 0 1px 2px rgba(36,36,36,.04), 0 4px 16px rgba(36,36,36,.04);
  --wt-shadow-hover: 0 2px 4px rgba(36,36,36,.05), 0 12px 28px rgba(36,36,36,.09);
  --wt-shadow-pop: 0 12px 40px rgba(36,36,36,.14);

  --wt-max: 1376px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--wt-ivory); color: var(--wt-ink); font-family: var(--wt-font); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }

.wt-app { container-type: inline-size; container-name: app; min-height: 100vh; background: var(--wt-ivory); color: var(--wt-ink); font-size: 15px; line-height: 1.55; position: relative; }
.wt-wrap { max-width: var(--wt-max); margin: 0 auto; padding: 0 32px; }

/* ---------- Wordmark ---------- */
.wt-logo { display: inline-flex; align-items: baseline; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: var(--wt-ink); line-height: 1; user-select: none; cursor: pointer; background: none; border: 0; padding: 0; }
.wt-logo .ter { color: var(--wt-navy); font-weight: 500; }
.wt-logo .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--wt-butter); margin-left: 3px; align-self: flex-end; margin-bottom: 2px; box-shadow: 0 0 0 1px rgba(36,36,36,.08) inset; }

/* ---------- Header ---------- */
.wt-header { position: sticky; top: 0; z-index: 30; background: rgba(247,245,239,.92); backdrop-filter: blur(8px); }
.wt-header-in { height: 64px; display: flex; align-items: center; gap: 12px; }
.wt-header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.wt-iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--wt-ink); transition: background .15s; position: relative; }
.wt-iconbtn:hover { background: rgba(36,36,36,.06); }
.wt-avatar-btn { display: flex; align-items: center; gap: 4px; background: none; border: 0; padding: 4px; border-radius: var(--wt-r-pill); color: var(--wt-muted); }

/* ---------- Buttons ---------- */
.wt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: var(--wt-r-pill); font-size: 14px; font-weight: 600; border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s, transform .1s; white-space: nowrap; }
.wt-btn:active { transform: scale(.98); }
.wt-btn-primary { background: var(--wt-navy); color: #fff; }
.wt-btn-primary:hover { background: var(--wt-navy-700); }
.wt-btn-ink { background: var(--wt-ink); color: #fff; }
.wt-btn-ink:hover { background: #000; }
.wt-btn-outline { background: transparent; color: var(--wt-ink); border-color: var(--wt-ink); }
.wt-btn-outline:hover { background: var(--wt-ink); color: #fff; }
.wt-btn-ghost { background: transparent; color: var(--wt-ink); border-color: var(--wt-border); }
.wt-btn-ghost:hover { background: var(--wt-light); }
.wt-btn-soft { background: var(--wt-light); color: var(--wt-ink); }
.wt-btn-soft:hover { background: #E8E7E2; }
.wt-btn-danger { background: var(--wt-wine); color: #fff; }
.wt-btn-danger:hover { background: #6E3437; }
.wt-btn-lg { height: 48px; padding: 0 24px; font-size: 16px; }
.wt-btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.wt-btn-block { width: 100%; }
.wt-btn[disabled] { opacity: .45; cursor: not-allowed; }
.wt-btn.is-on-like { color: var(--wt-wine); border-color: var(--wt-wine); background: var(--wt-wine-50); }
.wt-btn.is-on-scrap { color: var(--wt-navy); border-color: var(--wt-navy); background: var(--wt-navy-50); }

/* ---------- Nav tabs ---------- */
.wt-nav { display: flex; align-items: center; gap: 4px; height: 52px; }
.wt-nav-tab { position: relative; height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 6px; background: none; border: 0; font-size: 17px; font-weight: 600; color: var(--wt-muted); transition: color .15s; }
.wt-nav-tab:hover { color: var(--wt-ink); }
.wt-nav-tab.active { color: var(--wt-ink); font-weight: 700; }
.wt-nav-tab.active::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; background: var(--wt-ink); border-radius: 2px; }
.wt-nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ---------- Segmented / chips ---------- */
.wt-seg { display: inline-flex; background: var(--wt-card); border: 1px solid var(--wt-border); border-radius: var(--wt-r-pill); padding: 3px; gap: 2px; }
.wt-seg button { border: 0; background: transparent; height: 30px; padding: 0 14px; border-radius: var(--wt-r-pill); font-size: 13px; font-weight: 600; color: var(--wt-muted); }
.wt-seg button.on { background: var(--wt-ink); color: #fff; }
.wt-chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 14px; border-radius: var(--wt-r-pill); border: 1px solid var(--wt-border); background: var(--wt-card); font-size: 13px; font-weight: 600; color: var(--wt-ink); transition: all .15s; }
.wt-chip:hover { border-color: #CFCCC4; }
.wt-chip.on { background: var(--wt-navy); color: #fff; border-color: var(--wt-navy); }
.wt-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--wt-r-pill); background: var(--wt-light); color: #555; font-size: 12px; font-weight: 500; }

/* ---------- Badges ---------- */
.wt-status { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--wt-r-sm); font-size: 11.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.wt-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.wt-status.live { background: var(--wt-navy-50); color: var(--wt-navy); }
.wt-status.soon { background: var(--wt-butter-50); color: #8A6A12; }
.wt-status.stop { background: var(--wt-light); color: var(--wt-muted); }
.wt-lv { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--wt-r-sm); font-family: var(--wt-mono); font-size: 10.5px; font-weight: 700; color: var(--wt-navy); background: var(--wt-navy-50); letter-spacing: 0; }
.wt-scope { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 3px; font-family: var(--wt-mono); font-size: 10px; font-weight: 500; letter-spacing: .02em; border: 1px dashed currentColor; white-space: nowrap; vertical-align: middle; }
.wt-scope.review { color: #8A6A12; background: var(--wt-butter-50); }
.wt-scope.ext { color: var(--wt-wine); background: var(--wt-wine-50); }
.wt-app.hide-scope .wt-scope { display: none; }

/* ---------- Avatar ---------- */
.wt-ava { border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; color: var(--wt-ink); flex-shrink: 0; overflow: hidden; border: 1px solid rgba(36,36,36,.06); }

/* ---------- Card ---------- */
.wt-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 32px 24px; }
.wt-card { background: var(--wt-card); border-radius: var(--wt-r-sm); box-shadow: var(--wt-shadow-card); overflow: hidden; display: flex; flex-direction: column; transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; position: relative; }
.wt-card:hover { transform: translateY(-6px); box-shadow: var(--wt-shadow-hover); }
.wt-card-thumb { position: relative; }
.wt-card-launch { position: absolute; right: 10px; bottom: 10px; height: 30px; padding: 0 12px; border-radius: var(--wt-r-pill); border: 0; background: rgba(36,36,36,.86); color: #fff; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; opacity: 0; transform: translateY(4px); transition: all .18s; backdrop-filter: blur(4px); }
.wt-card:hover .wt-card-launch, .wt-card-launch:focus { opacity: 1; transform: none; }
.wt-card-launch:hover { background: var(--wt-navy); }
.wt-card-rank { position: absolute; left: 10px; top: 10px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: var(--wt-r-sm); background: var(--wt-ink); color: #fff; font-family: var(--wt-mono); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.wt-card-rank.top { background: var(--wt-butter); color: var(--wt-ink); }
.wt-card-body { padding: 16px 16px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.wt-card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--wt-muted); }
.wt-card-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.35; }
.wt-card-desc { font-size: 13.5px; color: #555; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; line-height: 1.45; }
.wt-card-reason { font-size: 12px; color: var(--wt-navy); background: var(--wt-navy-50); padding: 6px 8px; border-radius: var(--wt-r-sm); margin-top: 2px; line-height: 1.4; }
.wt-card-extra { font-size: 12px; color: var(--wt-muted); display: flex; gap: 8px; align-items: center; }
.wt-card-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--wt-light); font-size: 12.5px; }
.wt-card-by { display: flex; align-items: center; gap: 6px; color: var(--wt-muted); min-width: 0; background: none; border: 0; padding: 0; font-size: 12.5px; }
.wt-card-by b { color: var(--wt-ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt-card-by:hover b { text-decoration: underline; }
.wt-card-stats { margin-left: auto; display: flex; gap: 2px; }
.wt-stat { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; border: 0; background: none; border-radius: var(--wt-r-sm); color: #6b6b6b; font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.wt-stat:hover { background: var(--wt-light); color: var(--wt-ink); }
.wt-stat.on-like { color: var(--wt-wine); }
.wt-stat.on-scrap { color: var(--wt-navy); }

/* ---------- Thumbnail (가상 스크린샷) ---------- */
.wt-thumb { container-type: inline-size; position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--wt-light); }
.wt-thumb img.wt-thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wt-win { position: absolute; left: 7%; right: 7%; top: 10%; bottom: -4%; background: #fff; border-radius: 2.4cqw 2.4cqw 0 0; box-shadow: 0 1.2cqw 4cqw rgba(36,36,36,.12); overflow: hidden; display: flex; flex-direction: column; }
.wt-win-bar { height: 6.4cqw; flex-shrink: 0; display: flex; align-items: center; gap: 1.1cqw; padding: 0 2.6cqw; border-bottom: 1px solid #EEECE6; }
.wt-win-bar i { width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: #E2DFD7; display: block; }
.wt-win-bar span { margin-left: 2cqw; height: 2.6cqw; width: 30%; border-radius: 2cqw; background: #F1F0EC; }
.wt-win-body { flex: 1; position: relative; overflow: hidden; font-family: var(--wt-font); color: var(--wt-ink); }
.wt-ph { position: absolute; inset: 0; display: grid; place-items: center; background: repeating-linear-gradient(135deg, #EFEDE7 0 8px, #F5F3EE 8px 16px); color: var(--wt-muted); font-family: var(--wt-mono); font-size: 12px; }

/* ---------- Section heads ---------- */
.wt-sec { margin-top: 56px; }
.wt-sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.wt-sec-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.wt-sec-sub { font-size: 14px; color: var(--wt-muted); }
.wt-more { margin-left: auto; background: none; border: 0; font-size: 14px; font-weight: 600; color: var(--wt-muted); padding: 4px 0; }
.wt-more:hover { color: var(--wt-ink); }
.wt-page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }

/* ---------- Search ---------- */
.wt-search { position: relative; display: flex; align-items: center; background: var(--wt-card); border: 1.5px solid var(--wt-ink); border-radius: var(--wt-r-pill); height: 60px; padding: 0 8px 0 24px; gap: 12px; transition: box-shadow .2s; }
.wt-search:focus-within { box-shadow: 0 0 0 5px rgba(53,68,92,.12); border-color: var(--wt-navy); }
.wt-search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 17px; color: var(--wt-ink); min-width: 0; }
.wt-search input::placeholder { color: #A5A39D; }
.wt-search-ai { font-family: var(--wt-mono); font-size: 11px; color: var(--wt-navy); background: var(--wt-navy-50); padding: 3px 8px; border-radius: var(--wt-r-sm); white-space: nowrap; }
.wt-search-go { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--wt-navy); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.wt-search-go:hover { background: var(--wt-navy-700); }
.wt-search-ex { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.wt-search-ex button { border: 0; background: transparent; color: #6b6b6b; font-size: 13.5px; padding: 4px 10px; border-radius: var(--wt-r-pill); border: 1px solid var(--wt-border); background: rgba(255,255,255,.6); }
.wt-search-ex button:hover { color: var(--wt-ink); background: #fff; }

/* ---------- Forms ---------- */
.wt-field { display: flex; flex-direction: column; gap: 8px; }
.wt-label { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.wt-req { color: var(--wt-wine); font-weight: 700; }
.wt-opt { color: var(--wt-muted); font-weight: 500; font-size: 12px; }
.wt-help { font-size: 12.5px; color: var(--wt-muted); }
.wt-input, .wt-textarea, .wt-select { width: 100%; border: 1px solid var(--wt-border); background: var(--wt-card); border-radius: var(--wt-r-md); padding: 0 14px; height: 46px; font-size: 15px; color: var(--wt-ink); outline: none; transition: border-color .15s, box-shadow .15s; }
.wt-textarea { padding: 12px 14px; height: auto; min-height: 140px; resize: vertical; line-height: 1.6; }
.wt-input:focus, .wt-textarea:focus, .wt-select:focus { border-color: var(--wt-navy); box-shadow: 0 0 0 3px rgba(53,68,92,.12); }
.wt-input::placeholder, .wt-textarea::placeholder { color: #B3B1AA; }
.wt-input.err { border-color: var(--wt-wine); }
.wt-err { font-size: 12.5px; color: var(--wt-wine); }
.wt-counter { font-family: var(--wt-mono); font-size: 11px; color: var(--wt-muted); margin-left: auto; font-weight: 400; }
.wt-drop { border: 1.5px dashed #CFCCC4; border-radius: var(--wt-r-md); background: rgba(255,255,255,.6); display: grid; place-items: center; text-align: center; color: var(--wt-muted); font-size: 13px; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; }
.wt-drop:hover { border-color: var(--wt-navy); color: var(--wt-navy); background: #fff; }
.wt-check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.wt-check input { width: 18px; height: 18px; accent-color: var(--wt-navy); }

/* ---------- Tabs (content) ---------- */
.wt-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--wt-border); overflow-x: auto; scrollbar-width: none; }
.wt-tabs::-webkit-scrollbar { display: none; }
.wt-tab { position: relative; background: none; border: 0; height: 48px; padding: 0 16px; font-size: 15px; font-weight: 600; color: var(--wt-muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.wt-tab:hover { color: var(--wt-ink); }
.wt-tab.on { color: var(--wt-ink); font-weight: 700; }
.wt-tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--wt-ink); }
.wt-tab small { font-family: var(--wt-mono); font-size: 11px; color: var(--wt-muted); font-weight: 500; }

/* ---------- Dropdown ---------- */
.wt-pop { position: absolute; top: calc(100% + 8px); right: 0; background: var(--wt-card); border-radius: var(--wt-r-md); box-shadow: var(--wt-shadow-pop); border: 1px solid var(--wt-border); min-width: 240px; padding: 6px; z-index: 40; animation: wtPop .16s ease; }
@keyframes wtPop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.wt-pop-item { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: none; border: 0; height: 40px; padding: 0 12px; border-radius: 6px; font-size: 14px; color: var(--wt-ink); }
.wt-pop-item:hover { background: var(--wt-light); }
.wt-pop-sep { height: 1px; background: var(--wt-light); margin: 6px 4px; }
.wt-pop-head { display: flex; gap: 12px; align-items: center; padding: 12px 12px 14px; }

/* ---------- Sidebar ---------- */
.wt-scrim { position: fixed; inset: 0; background: rgba(36,36,36,.28); z-index: 50; animation: wtFade .2s ease; }
@keyframes wtFade { from { opacity: 0; } to { opacity: 1; } }
.wt-side { position: fixed; top: 0; bottom: 0; left: 0; width: 272px; max-width: 84%; background: var(--wt-ivory); z-index: 51; display: flex; flex-direction: column; animation: wtSlide .24s cubic-bezier(.2,.8,.2,1); box-shadow: 8px 0 32px rgba(36,36,36,.1); }
@keyframes wtSlide { from { transform: translateX(-100%); } to { transform: none; } }
.wt-side-head { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.wt-side-body { flex: 1; overflow-y: auto; padding: 8px 12px 24px; }
.wt-side-label { font-size: 12px; font-weight: 700; color: var(--wt-muted); padding: 16px 12px 8px; letter-spacing: .02em; }
.wt-side-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border-radius: var(--wt-r-md); border: 0; background: none; text-align: left; font-size: 15px; font-weight: 500; color: var(--wt-ink); }
.wt-side-item:hover { background: rgba(36,36,36,.05); }
.wt-side-item.on { background: var(--wt-card); font-weight: 700; box-shadow: var(--wt-shadow-card); }
.wt-side-item .cnt { margin-left: auto; font-family: var(--wt-mono); font-size: 11px; color: var(--wt-muted); }
.wt-side-foot { padding: 16px 24px 24px; font-size: 13px; color: var(--wt-muted); border-top: 1px solid var(--wt-border); }

/* ---------- Modal ---------- */
.wt-modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(36,36,36,.36); animation: wtFade .18s ease; }
.wt-modal { background: var(--wt-card); border-radius: var(--wt-r-lg); width: 100%; max-width: 420px; box-shadow: var(--wt-shadow-pop); padding: 28px; position: relative; animation: wtPop .2s ease; max-height: calc(100% - 20px); overflow-y: auto; }
.wt-modal h3 { margin: 0 0 8px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.wt-modal p { margin: 0; color: #555; font-size: 14.5px; }
.wt-modal-x { position: absolute; top: 14px; right: 14px; }
.wt-modal-actions { display: flex; gap: 8px; margin-top: 24px; }
.wt-modal-actions .wt-btn { flex: 1; height: 44px; }

/* ---------- Toast ---------- */
.wt-toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--wt-ink); color: #fff; padding: 12px 18px; border-radius: var(--wt-r-pill); font-size: 14px; font-weight: 500; z-index: 70; box-shadow: var(--wt-shadow-pop); animation: wtToast .25s ease; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.wt-toast button { background: none; border: 0; color: var(--wt-butter); font-weight: 700; font-size: 14px; padding: 0; }
@keyframes wtToast { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Footer ---------- */
.wt-footer { margin-top: 96px; border-top: 1px solid var(--wt-border); padding: 32px 0 48px; font-size: 13px; color: var(--wt-muted); }
.wt-footer-in { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }

/* ---------- Misc ---------- */
.wt-box { background: var(--wt-card); border-radius: var(--wt-r-md); border: 1px solid var(--wt-border); }
.wt-empty { padding: 72px 20px; text-align: center; color: var(--wt-muted); }
.wt-empty b { display: block; color: var(--wt-ink); font-size: 17px; margin-bottom: 6px; }
.wt-mono { font-family: var(--wt-mono); }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

      <div className="twk-sect">{label}</div>
      {children}

}

function TweakRow({ label, value, children, inline = false }) {

    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts __edit_mode_chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <__TwkSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  // Dep mirrors the memo body verbatim so collidable joins like
  // ['a\nb','c'] vs ['a','b','c'] don't share a stale sessionStorage key
  // (gen-spark PR #28600 Bugbot R3 — minor divergence from Tiffany's
  // `items.join('\n')` dep; upstream report pending).
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [JSON.stringify(items)]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

/* ---------- Small atoms ---------- */
function Avatar({ user, size = 32 }) {

function LvBadge({ lv }) {

function StatusBadge({ status }) {

}
/* 기능 범위 표시: review = 추가 검토, ext = 확장 */
function Scope({ kind = 'review' }) {
  return <span className={'wt-scope ' + kind} title={kind === 'ext' ? '확장 기능 — MVP 미포함 가능' : '추가 검토 기능 — 멘토 피드백 후 확정'}>{kind === 'ext' ? '확장' : '검토'}</span>;
}
const fmt = (n) => n >= 10000 ? (n / 10000).toFixed(1).replace('.0', '') + '만' : n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n);
const fmtDate = (d) => { const [y, m, dd] = d.split('-'); return `${y}년 ${+m}월 ${+dd}일`; };
const relDate = (d) => {
  const diff = Math.round((new Date('2026-10-15') - new Date(d)) / 86400000);
  if (diff <= 0) return '오늘'; if (diff === 1) return '어제'; if (diff < 7) return diff + '일 전'; if (diff < 30) return Math.floor(diff / 7) + '주 전';
  return fmtDate(d);
};

function CatChips({ value, onChange }) {

}
function SampleNote({ children }) {
  return <div className="wt-note"><Icon name="spark" size={15} />{children}</div>;
}

function TrendingPage() {
  const wt = useWt();
  const [cat, setCat] = useState('all');
  const items = wt.services.filter(s => !s.hidden && s.status !== 'stop' && (cat === 'all' || s.cat === cat)).sort((a, b) => b.trend - a.trend);
  return (
    <ListLayout title="트렌딩" desc="최근 7일 동안 반응이 가장 빠르게 늘어난 서비스예요."
      note={<SampleNote>트렌딩 점수 산정 방식은 확정 전이에요. 지금은 샘플 데이터 기준으로 정렬했어요. <Scope /></SampleNote>}>
      <CatChips value={cat} onChange={setCat} />
      <CardGrid items={items} rankStart={1} render={(s, i) => (
        <ServiceCard key={s.id} s={s} rank={i + 1} extra={<><Icon name="trend" size={14} style={{ color: 'var(--wt-wine)' }} /><span style={{ color: 'var(--wt-wine)', fontWeight: 600 }}>+{s.trend}%</span> 지난주 대비 반응</>} />
      )} />
    </ListLayout>
  );
}

function PopularPage() {
  const wt = useWt();
  const [period, setPeriod] = useState('month');
  const mult = { day: 0.04, week: 0.25, month: 1 }[period];
  const score = (s) => (s.likes * 2 + s.scraps * 3 + s.clicks * 0.1) * mult * (period === 'day' ? (1 + s.trend / 100) : 1);
  const items = wt.services.filter(s => !s.hidden).sort((a, b) => score(b) - score(a));
  const seg = (
    <div className="wt-seg">{[['day', '하루'], ['week', '일주일'], ['month', '한 달']].map(([k, l]) => <button key={k} className={period === k ? 'on' : ''} onClick={() => setPeriod(k)}>{l}</button>)}</div>
  );
  const label = { day: '오늘', week: '이번 주', month: '이번 달' }[period];
  return (
    <ListLayout title="인기" desc={`${label} 누적 반응(좋아요·스크랩·이용)이 가장 많은 서비스예요.`} right={seg}
      note={<SampleNote>인기 산정 공식은 확정 전이에요. 좋아요·스크랩·이용 클릭을 활용하는 방향으로 검토 중입니다. <Scope /></SampleNote>}>
      <CardGrid items={items} render={(s, i) => <ServiceCard key={s.id + period} s={s} rank={i + 1} extra={<>{label} 이용 {fmt(Math.round(s.clicks * mult))}회</>} />} />
    </ListLayout>
  );
}

function LatestPage() {
  const wt = useWt();
  const [cat, setCat] = useState('all');
  const items = wt.services.filter(s => !s.hidden && (cat === 'all' || s.cat === cat)).sort((a, b) => b.created.localeCompare(a.created));
  return (
    <ListLayout title="최신" desc="등록일 기준 최신순으로 보여드려요.">
      <CatChips value={cat} onChange={setCat} />
      <CardGrid items={items} render={(s) => <ServiceCard key={s.id} s={s} extra={<>{relDate(s.created)} 등록</>} />} />
    </ListLayout>
  );
}

function FollowPage() {
  const wt = useWt();
  const items = wt.services.filter(s => !s.hidden && wt.follows.has(s.owner)).sort((a, b) => b.created.localeCompare(a.created));
  const users = [...wt.follows].map(id => WT_USERS[id]);
  return (
    <ListLayout title={<>팔로우 <Scope /></>} desc="내가 팔로우한 사람들이 등록한 서비스를 최신순으로 모았어요.">
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 28 }}>
        <span style={{ fontSize: 13, color: 'var(--wt-muted)', marginRight: 4 }}>팔로우 중 {users.length}명</span>
        {users.map(u => <button key={u.id} className="wt-chip" onClick={() => wt.go('profile', { id: u.id })}><Avatar user={u} size={20} />{u.nick}</button>)}
      </div>
      {items.length ? <CardGrid items={items} render={(s) => <ServiceCard key={s.id} s={s} extra={<>{relDate(s.created)} 등록</>} />} />
        : <div className="wt-empty"><b>아직 팔로우한 사람이 없어요</b>마음에 드는 서비스를 만든 개발자를 팔로우해 보세요.</div>}
    </ListLayout>
  );
}

function CategoryPage() {
  const wt = useWt();
  const cat = wt.route.params.cat || 'all';
  const [sort, setSort] = useState('trend');
  const items = wt.services.filter(s => !s.hidden && (cat === 'all' || s.cat === cat))
    .sort((a, b) => sort === 'trend' ? b.trend - a.trend : sort === 'new' ? b.created.localeCompare(a.created) : b.likes - a.likes);
  return (
    <ListLayout title={WT_CAT_LABEL[cat]} desc={`${WT_CAT_LABEL[cat]} 카테고리 서비스 ${items.length}개`}
      right={<div className="wt-seg">{[['trend', '트렌딩'], ['like', '인기'], ['new', '최신']].map(([k, l]) => <button key={k} className={sort === k ? 'on' : ''} onClick={() => setSort(k)}>{l}</button>)}</div>}>
      <CatChips value={cat} onChange={(c) => wt.go('category', { cat: c })} />
      <CardGrid items={items} />
    </ListLayout>
  );
}

/* ---------- 06 AI 검색 결과 ---------- */
function SearchPage() {
  const wt = useWt();
  const q = wt.route.params.q || '';
  const [cat, setCat] = useState('all');
  const [sort, setSort] = useState('match');
  const [loading, setLoading] = useState(!!q);
  useEffect(() => { setCat('all'); if (q) { setLoading(true); const t = setTimeout(() => setLoading(false), 650); return () => clearTimeout(t); } }, [q]);
  const res = useMemo(() => wtSearch(q), [q]);
  let items = res.items.filter(x => cat === 'all' || x.s.cat === cat);
  if (sort === 'like') items = [...items].sort((a, b) => b.s.likes - a.s.likes);
  if (sort === 'new') items = [...items].sort((a, b) => b.s.created.localeCompare(a.s.created));
  const catsInRes = ['all', ...new Set(res.items.map(x => x.s.cat))];
  return (
    <>
      <div className="wt-wrap" style={{ paddingTop: 28 }}>
        <div style={{ maxWidth: 820 }}><SearchBar initial={q} autoFocus={!q} size="sm" /></div>
        {!q ? (
          <div style={{ marginTop: 40 }}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>이렇게 물어보세요</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'flex-start' }}>
              {WT_SEARCH_EXAMPLES.map(ex => <button key={ex} className="wt-pop-item" style={{ width: 'auto', fontSize: 15 }} onClick={() => wt.go('search', { q: ex })}><Icon name="search" size={16} style={{ color: 'var(--wt-muted)' }} />{ex}</button>)}
            </div>
          </div>
        ) : (
          <>
            <div style={{ marginTop: 32 }}>
              <h1 className="wt-page-title" style={{ fontSize: 24, textWrap: 'pretty' }}>‘{q}’ 검색 결과 <span style={{ color: 'var(--wt-muted)', fontWeight: 600 }}>{loading ? '' : res.items.length + '개'}</span></h1>
            </div>
            <div className="wt-ai-box">
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13.5, fontWeight: 700, color: 'var(--wt-navy)' }}>
                <Icon name="spark" size={16} /> {loading ? '검색 의도를 이해하고 있어요…' : res.ai ? `‘${res.intent}’ 서비스를 찾고 계신 것 같아요` : '입력한 키워드로 찾았어요'}
              </div>
              {!loading && <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 }}>{res.chips.map(c => <span key={c} className="wt-tag" style={{ background: '#fff', border: '1px solid var(--wt-border)' }}>{c}</span>)}</div>}
              <div style={{ fontSize: 12, color: 'var(--wt-muted)', marginTop: 10 }}>AI가 문장의 의도를 분석해 조건을 정리했어요. 프로토타입에서는 가상의 결과를 보여줍니다.</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '28px 0 24px', flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {catsInRes.map(c => <button key={c} className={'wt-chip' + (cat === c ? ' on' : '')} onClick={() => setCat(c)}>{WT_CAT_LABEL[c]}</button>)}
              </div>
              <select className="wt-select" value={sort} onChange={(e) => setSort(e.target.value)} style={{ width: 'auto', height: 36, marginLeft: 'auto', borderRadius: 999, fontSize: 13, fontWeight: 600, padding: '0 14px' }}>
                <option value="match">관련도순</option><option value="like">좋아요순</option><option value="new">최신순</option>
              </select>
            </div>
            {loading ? (
              <div className="wt-grid" style={{ '--cols': wt.tweaks.cols }}>{[0, 1, 2, 3].map(i => <div key={i} className="wt-skel" />)}</div>
            ) : items.length ? (
              <CardGrid items={items.map(x => x.s)} render={(s) => <ServiceCard key={s.id} s={s} reason={wt.tweaks.showReason ? items.find(x => x.s.id === s.id).reason : null} />} />
            ) : (
              <div className="wt-empty"><b>딱 맞는 서비스를 찾지 못했어요</b>다른 표현으로 검색하거나 카테고리에서 둘러보세요.
                <div style={{ marginTop: 16 }}><button className="wt-btn wt-btn-ghost" onClick={() => wt.setSide(true)}>카테고리 열기</button></div></div>
            )}
          </>
        )}
      </div>
      <Footer />
    </>
  );
}

Object.assign(window, { SearchBar, HomePage, TrendingPage, PopularPage, LatestPage, FollowPage, CategoryPage, SearchPage });

        <button className="wt-iconbtn" style={{ border: '1px solid var(--wt-border)', color: liked ? 'var(--wt-wine)' : undefined }} onClick={() => wt.toggleLike(s.id)}><Icon name="heart" size={19} fill={liked} /></button>
        {launchBtn('')}
      </div>

      <Footer />
      {writing && <ReviewModal s={s} onClose={() => setWriting(false)} onSubmit={(t) => { wt.addReview(s.id, t); setWriting(false); setTab('review'); wt.toast('리뷰가 등록되었어요'); }} />}
      {shot != null && (
        <div className="wt-modal-wrap" onClick={() => setShot(null)} style={{ background: 'rgba(36,36,36,.82)' }}>
          <div style={{ width: 'min(960px, 100%)', position: 'relative' }} onClick={(e) => e.stopPropagation()}>

              <span className="wt-mono" style={{ fontSize: 13 }}>{shot + 1} / 4</span>
              <button className="wt-iconbtn" style={{ color: '#fff', background: 'rgba(255,255,255,.12)' }} onClick={() => setShot((shot + 1) % 4)}><Icon name="chevRight" /></button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function FollowButton({ uid, block }) {
  const wt = useWt();
  const on = wt.follows.has(uid);
  return (
    <button className={'wt-btn ' + (on ? 'wt-btn-ghost' : 'wt-btn-ink')} style={block ? { width: '100%', height: 40 } : { height: 40 }}
      onClick={() => wt.toggleFollow(uid)}>
      {on ? <><Icon name="check" size={16} stroke={2.2} />팔로잉</> : <><Icon name="plus" size={16} stroke={2.2} />팔로우</>}

}

Object.assign(window, { DetailPage, ReviewModal, FollowButton });

<script type="text/babel">/* WEBTER — 08 로그인 / 09 회원가입 / 13 마이페이지 / 14 공개 프로필 */

function AuthShell({ title, sub, children, foot }) {
  const wt = useWt();
  return (
    <div className="wt-auth">
      <div className="wt-auth-card">
        <div style={{ textAlign: 'center', marginBottom: 28 }}>
          <Wordmark onClick={() => wt.go('home')} size={28} />

        </div>
        <h1 style={{ fontSize: 22, fontWeight: 800, margin: '0 0 6px', letterSpacing: '-0.02em' }}>{title}</h1>
        {sub && <p style={{ margin: '0 0 24px', color: 'var(--wt-muted)', fontSize: 14 }}>{sub}</p>}
        {children}
      </div>
      {foot && <div style={{ textAlign: 'center', marginTop: 20, fontSize: 14, color: 'var(--wt-muted)' }}>{foot}</div>}
    </div>

}

function LoginPage() {
  const wt = useWt();
  const [email, setEmail] = useState('dawn@webter.kr');
  const [pw, setPw] = useState('webter2026');
  const [err, setErr] = useState('');
  const submit = (e) => {
    e.preventDefault();
    if (!email.includes('@')) return setErr('이메일 형식을 확인해 주세요.');
    if (pw.length < 4) return setErr('비밀번호를 입력해 주세요.');
    wt.login();
  };
  return (
    <AuthShell title="로그인" sub="계정 하나로 서비스 탐색부터 등록까지 모두 이용할 수 있어요."
      foot={<>아직 계정이 없나요? <button className="wt-link" onClick={() => wt.go('signup')}>회원가입</button></>}>
      <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div className="wt-field"><label className="wt-label">이메일</label><input className={'wt-input' + (err.includes('이메일') ? ' err' : '')} value={email} onChange={(e) => { setEmail(e.target.value); setErr(''); }} placeholder="example@email.com" /></div>
        <div className="wt-field"><label className="wt-label">비밀번호</label><input type="password" className="wt-input" value={pw} onChange={(e) => { setPw(e.target.value); setErr(''); }} placeholder="비밀번호" /></div>
        {err && <div className="wt-err">{err}</div>}
        <button className="wt-btn wt-btn-primary wt-btn-lg wt-btn-block" type="submit" style={{ marginTop: 4 }}>로그인</button>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--wt-muted)' }}>
          <label className="wt-check" style={{ fontSize: 13 }}><input type="checkbox" defaultChecked />로그인 유지</label>
          <button type="button" className="wt-link" style={{ color: 'var(--wt-muted)', fontWeight: 500 }} onClick={() => wt.toast('비밀번호 찾기는 목업 화면이에요')}>비밀번호 찾기</button>
        </div>
      </form>
      <div className="wt-or"><span>또는</span></div>
      <div style={{ display: 'flex', gap: 8 }}>
        {['Google', 'GitHub', '카카오'].map(p => <button key={p} className="wt-btn wt-btn-ghost" style={{ flex: 1, height: 42, fontWeight: 500, color: '#555' }} onClick={() => wt.toast('소셜 로그인은 아직 검토 중이에요')}>{p}</button>)}
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--wt-muted)', textAlign: 'center', marginTop: 10 }}>소셜 로그인 제공 여부는 확정 전이에요 <Scope /></div>
    </AuthShell>
  );
}

function SignupPage() {
  const wt = useWt();
  const [f, setF] = useState({ email: '', pw: '', pw2: '', nick: '', terms: false, privacy: false });
  const [touched, setTouched] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const errs = {
    email: !f.email.includes('@') ? '올바른 이메일을 입력해 주세요.' : '',
    pw: f.pw.length < 8 ? '8자 이상 입력해 주세요.' : '',
    pw2: f.pw2 !== f.pw || !f.pw2 ? '비밀번호가 일치하지 않아요.' : '',
    nick: f.nick.trim().length < 2 ? '2자 이상 입력해 주세요.' : '',
    terms: !(f.terms && f.privacy) ? '필수 약관에 동의해 주세요.' : '',
  };
  const ok = !Object.values(errs).some(Boolean);
  const submit = (e) => { e.preventDefault(); setTouched(true); if (ok) { wt.login(f.nick.trim()); wt.toast('웹터에 오신 것을 환영해요!'); } };
  const fld = (k, label, props, help) => (
    <div className="wt-field">
      <label className="wt-label">{label}</label>
      <input className={'wt-input' + (touched && errs[k] ? ' err' : '')} value={f[k]} onChange={set(k)} {...props} />
      {touched && errs[k] ? <div className="wt-err">{errs[k]}</div> : help ? <div className="wt-help">{help}</div> : null}
    </div>
  );
  return (
    <AuthShell title="회원가입" sub="하나의 계정으로 서비스를 이용하고, 직접 만든 서비스도 등록할 수 있어요."
      foot={<>이미 계정이 있나요? <button className="wt-link" onClick={() => wt.go('login')}>로그인</button></>}>
      <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        {fld('email', '이메일', { placeholder: 'example@email.com' })}
        {fld('pw', '비밀번호', { type: 'password', placeholder: '8자 이상' }, '영문, 숫자를 포함해 8자 이상')}
        {fld('pw2', '비밀번호 확인', { type: 'password', placeholder: '비밀번호를 한 번 더 입력' })}
        {fld('nick', '닉네임', { placeholder: '예) 새벽코딩', maxLength: 16 }, '서비스 카드와 리뷰에 표시돼요')}
        <div className="wt-box" style={{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <label className="wt-check" style={{ fontWeight: 700 }}><input type="checkbox" checked={f.terms && f.privacy} onChange={(e) => setF({ ...f, terms: e.target.checked, privacy: e.target.checked })} />전체 동의</label>
          <div className="wt-divider" />
          <label className="wt-check"><input type="checkbox" checked={f.terms} onChange={set('terms')} />[필수] 이용약관 동의</label>
          <label className="wt-check"><input type="checkbox" checked={f.privacy} onChange={set('privacy')} />[필수] 개인정보 수집 및 이용 동의</label>
        </div>
        {touched && errs.terms && <div className="wt-err">{errs.terms}</div>}
        <button className="wt-btn wt-btn-primary wt-btn-lg wt-btn-block" type="submit">가입하기</button>
      </form>
    </AuthShell>
  );
}

/* ---------- 13 마이페이지 ---------- */
function MyPage() {
  const wt = useWt();
  const me = wt.me;
  const [tab, setTab] = useState(wt.route.params.tab || 'mine');
  useEffect(() => setTab(wt.route.params.tab || 'mine'), [wt.route.params.tab]);
  const mine = wt.services.filter(s => s.owner === me.id);
  const scrapped = wt.services.filter(s => wt.scraps.has(s.id));
  const liked = wt.services.filter(s => wt.likes.has(s.id));
  const myReviews = wt.allReviews().filter(r => r.user === me.id);
  const tabs = [['mine', '내 등록 서비스', mine.length], ['scrap', '스크랩', scrapped.length], ['like', '좋아요', liked.length], ['review', '내 리뷰', myReviews.length], ['settings', '계정 설정']];
  return (
    <>
      <div className="wt-wrap" style={{ maxWidth: 1120, paddingTop: 40 }}>
        <section className="wt-me-head">
          <Avatar user={me} size={wt.narrow ? 72 : 96} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 12.5, color: 'var(--wt-muted)', fontWeight: 600 }}>마이페이지 · 나만 볼 수 있어요</div>
            <h1 className="wt-page-title" style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 4 }}>{me.nick} <LvBadge lv={me.lv} /></h1>
            <p style={{ margin: '6px 0 0', color: '#555' }}>{me.bio}</p>
          </div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="wt-btn wt-btn-ghost" onClick={() => wt.go('profile', { id: me.id })}><Icon name="eye" size={16} />공개 프로필 보기</button>
            <button className="wt-btn wt-btn-primary" onClick={() => wt.go('register')}><Icon name="plus" size={16} stroke={2.2} />서비스 등록</button>
          </div>
        </section>
        <div className="wt-tabs" style={{ marginTop: 32 }}>
          {tabs.map(([k, l, n]) => <button key={k} className={'wt-tab' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}>{l}{n != null && <small>{n}</small>}{(k === 'scrap' || k === 'like') && <Scope />}</button>)}
        </div>
        <div style={{ marginTop: 28 }}>
          {tab === 'mine' && (
            <>
              <div style={{ display: 'flex', alignItems: 'center', marginBottom: 20 }}>
                <span style={{ color: 'var(--wt-muted)', fontSize: 14 }}>비공개 서비스도 여기서는 보여요.</span>
                <button className="wt-more" onClick={() => wt.go('manage')}>서비스 관리로 이동 →</button>
              </div>
              <CardGrid items={mine} cols={3} render={(s) => <ServiceCard key={s.id} s={s} extra={s.hidden ? <span className="wt-tag" style={{ height: 20 }}><Icon name="eyeOff" size={12} />&nbsp;비공개</span> : <>{relDate(s.created)} 등록</>} />} />

          )}
          {tab === 'scrap' && (scrapped.length ? <CardGrid items={scrapped} cols={3} /> : <div className="wt-empty"><b>스크랩한 서비스가 없어요</b>나중에 다시 보고 싶은 서비스를 스크랩해 두세요.<div style={{ marginTop: 16 }}><button className="wt-btn wt-btn-ghost" onClick={() => wt.go('trending')}>트렌딩 둘러보기</button></div></div>)}
          {tab === 'like' && (liked.length ? <CardGrid items={liked} cols={3} /> : <div className="wt-empty"><b>좋아요한 서비스가 없어요</b></div>)}
          {tab === 'review' && (
            <div className="wt-reviews" style={{ maxWidth: 760 }}>
              {myReviews.length === 0 && <div className="wt-empty"><b>작성한 리뷰가 없어요</b>써 본 서비스에 리뷰를 남겨 개발자에게 힘을 보태 주세요.</div>}
              {myReviews.map(r => {
                const s = wt.services.find(x => x.id === r.sid);
                return (
                  <div key={r.id} className="wt-review" style={{ cursor: 'pointer' }} onClick={() => wt.go('detail', { id: s.id, tab: 'review' })}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}><ServiceIcon s={s} size={32} /><b>{s.name}</b><span style={{ marginLeft: 'auto', fontSize: 12.5, color: 'var(--wt-muted)' }}>{fmtDate(r.date)}</span></div>
                    <p style={{ margin: '10px 0 0', fontSize: 14.5 }}>{r.text}</p>
                  </div>
                );
              })}
            </div>
          )}
          {tab === 'settings' && <SettingsPanel />}
        </div>
      </div>
      <Footer />
    </>
  );
}

function SettingsPanel() {
  const wt = useWt();
  const me = wt.me;
  const [nick, setNick] = useState(me.nick);
  const [bio, setBio] = useState(me.bio);
  return (
    <div style={{ maxWidth: 640, display: 'flex', flexDirection: 'column', gap: 22 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
        <Avatar user={me} size={64} />

      </div>
      <div className="wt-field"><label className="wt-label">닉네임</label><input className="wt-input" value={nick} onChange={(e) => setNick(e.target.value)} /></div>

      <div className="wt-field"><label className="wt-label">이메일</label><input className="wt-input" value="dawn@webter.kr" disabled style={{ background: 'var(--wt-light)', color: 'var(--wt-muted)' }} /></div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="wt-btn wt-btn-primary" onClick={() => { wt.updateMe({ nick: nick.trim() || me.nick, bio }); wt.toast('저장되었어요'); }}>저장하기</button>
        <button className="wt-btn wt-btn-ghost" onClick={() => wt.toast('비밀번호 변경은 목업이에요')}>비밀번호 변경</button>

      <div className="wt-divider" />
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, fontSize: 14 }}>

      </div>
    </div>
  );
}

/* ---------- 14 공개 프로필 ---------- */
function ProfilePage() {
  const wt = useWt();
  const uid = wt.route.params.id || 'u_bori';
  const u = uid === WT_ME_ID && wt.me ? wt.me : WT_USERS[uid];
  const isMe = wt.me && uid === wt.me.id;
  const list = wt.services.filter(s => s.owner === uid && !s.hidden);
  const followers = u.followers + (wt.follows.has(uid) ? 1 : 0);
  const totalLikes = list.reduce((a, s) => a + s.likes, 0);
  return (
    <>
      <div className="wt-wrap" style={{ maxWidth: 1120, paddingTop: 48 }}>
        {isMe && <div className="wt-note" style={{ marginBottom: 24 }}><Icon name="eye" size={15} />다른 사용자에게 보이는 내 공개 프로필이에요. 계정 정보와 스크랩·좋아요 활동은 표시되지 않아요.</div>}
        <section className="wt-prof-head">
          <Avatar user={u} size={wt.narrow ? 84 : 120} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <h1 className="wt-page-title" style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: wt.narrow ? 24 : 32 }}>{u.nick} <LvBadge lv={u.lv} /></h1>
            <p style={{ margin: '8px 0 0', color: '#555', fontSize: 15.5 }}>{u.bio}</p>
            <div className="wt-prof-nums">
              <span><b>{list.length}</b> 서비스</span>
              <span><b>{fmt(totalLikes)}</b> 받은 좋아요</span>
              <span><b>{followers}</b> 팔로워 <Scope /></span>
              <span><b>{u.following}</b> 팔로잉</span>
            </div>
          </div>
          <div>{isMe ? <button className="wt-btn wt-btn-ghost" style={{ height: 40 }} onClick={() => wt.go('mypage', { tab: 'settings' })}>프로필 수정</button> : <FollowButton uid={uid} />}</div>
        </section>
        <hr className="wt-divider" style={{ margin: '40px 0 32px' }} />
        <SecHead title={`${u.nick}님이 만든 서비스`} sub="등록한 서비스가 자동으로 표시돼요" />
        {list.length ? <CardGrid items={list} cols={3} /> : <div className="wt-empty"><b>아직 공개된 서비스가 없어요</b></div>}
      </div>
      <Footer />
    </>
  );
}

Object.assign(window, { LoginPage, SignupPage, MyPage, ProfilePage });
</script>
<script type="text/babel">/* WEBTER — 10 서비스 등록 / 12 서비스 수정 (공통 폼) / 11 내 서비스 관리 */

const WT_EMPTY_FORM = { name: '', tagline: '', desc: '', cat: '', tags: [], url: '', status: 'live', cover: false, shots: 0 };

function ServiceForm({ mode }) {
  const wt = useWt();
  const editing = mode === 'edit';
  const src = editing ? wt.services.find(s => s.id === wt.route.params.id) : null;
  const [f, setF] = useState(() => src
    ? { name: src.name, tagline: src.tagline, desc: src.desc, cat: src.cat, tags: [...src.tags], url: 'https://' + src.id + '.example-deploy.app', status: src.status, cover: true, shots: 3 }
    : { ...WT_EMPTY_FORM });
  const [tagIn, setTagIn] = useState('');
  const [touched, setTouched] = useState(false);
  const [done, setDone] = useState(null);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const errs = {
    name: !f.name.trim() && '서비스명을 입력해 주세요.',
    tagline: !f.tagline.trim() && '한 줄 소개를 입력해 주세요.',
    cat: !f.cat && '카테고리를 선택해 주세요.',
    url: !/^https?:\/\/.+\..+/.test(f.url) && 'https:// 로 시작하는 실행 URL을 입력해 주세요.',
    cover: !f.cover && '대표 이미지를 올려 주세요.',
  };
  const required = ['name', 'tagline', 'cat', 'url', 'cover'];
  const filled = required.filter(k => !errs[k]).length;
  const addTag = () => { const t = tagIn.trim().replace(/^#/, ''); if (t && !f.tags.includes(t) && f.tags.length < 5) set('tags', [...f.tags, t]); setTagIn(''); };
  const preview = {
    id: src ? src.id : 'new', name: f.name || '서비스명', tagline: f.tagline || '한 줄 소개가 여기에 표시돼요', cat: f.cat || 'etc', owner: WT_ME_ID,
    likes: src ? src.likes : 0, scraps: src ? src.scraps : 0, status: f.status, created: '2026-10-15', tags: f.tags,
    thumb: src ? src.thumb : { kind: 'poll', bg: '#EAE7DF', a: '#35445C', b: '#F2DB94' },
  };
  const submit = () => {
    setTouched(true);
    if (Object.values(errs).some(Boolean)) { wt.toast('필수 항목을 확인해 주세요'); return; }
    if (editing) { wt.updateService(src.id, { name: f.name, tagline: f.tagline, desc: f.desc || src.desc, cat: f.cat, tags: f.tags, status: f.status }); wt.toast('수정 내용이 저장되었어요'); wt.go('manage'); }
    else { const id = wt.addService({ ...f, desc: f.desc || f.tagline }); setDone(id); }
  };
  const fillDemo = () => setF({ name: '오늘 뭐 먹지', tagline: '냉장고 속 재료로 만들 수 있는 요리를 추천해 주는 서비스', desc: '가지고 있는 재료를 고르면 바로 만들 수 있는 요리와 레시피를 보여줍니다.', cat: 'ai', tags: ['요리', 'AI 추천', '레시피'], url: 'https://my-service.example.app', status: 'live', cover: true, shots: 2 });

  const E = ({ k }) => touched && errs[k] ? <div className="wt-err">{errs[k]}</div> : null;

  if (done) {
    const s = wt.services.find(x => x.id === done);
    return (
      <div className="wt-wrap" style={{ maxWidth: 560, padding: '80px 20px 120px', textAlign: 'center' }}>
        <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'var(--wt-navy)', color: '#fff', display: 'grid', placeItems: 'center', margin: '0 auto 24px' }}><Icon name="check" size={30} stroke={2.4} /></div>
        <h1 className="wt-page-title">서비스가 등록되었어요!</h1>
        <p style={{ color: 'var(--wt-muted)', margin: '10px 0 32px' }}>이제 웹터 사용자들이 <b style={{ color: 'var(--wt-ink)' }}>{s.name}</b>을(를) 발견하고 이용할 수 있어요.<br />최신 탭에 바로 노출됩니다.</p>
        <div style={{ maxWidth: 320, margin: '0 auto 32px', textAlign: 'left', pointerEvents: 'none' }}><ServiceCard s={s} /></div>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap' }}>
          <button className="wt-btn wt-btn-ghost wt-btn-lg" onClick={() => wt.go('manage')}>내 서비스 관리</button>
          <button className="wt-btn wt-btn-primary wt-btn-lg" onClick={() => wt.go('detail', { id: s.id })}>등록한 서비스 보기</button>
        </div>
      </div>
    );
  }

  return (
    <>

            <h1 className="wt-page-title">{editing ? '서비스 정보 수정' : '웹 서비스 등록'}</h1>
            <p style={{ margin: '6px 0 0', color: 'var(--wt-muted)' }}>{editing ? '수정한 내용은 저장 즉시 상세 페이지에 반영돼요.' : '필수 항목 5개만 채우면 바로 등록할 수 있어요. 나머지는 나중에 추가해도 괜찮아요.'}</p>
          </div>
          {!editing && <button className="wt-btn wt-btn-soft wt-btn-sm" style={{ marginLeft: 'auto' }} onClick={fillDemo}>데모: 예시로 채우기</button>}
        </div>

        <div className="wt-form-layout">
          <div className="wt-form">
            <fieldset className="wt-fs">
              <legend>기본 정보 <span className="wt-mono">필수</span></legend>
              <div className="wt-field">
                <label className="wt-label">서비스명 <span className="wt-req">*</span><span className="wt-counter">{f.name.length} / 30</span></label>
                <input className={'wt-input' + (touched && errs.name ? ' err' : '')} maxLength={30} value={f.name} onChange={(e) => set('name', e.target.value)} placeholder="예) 둘이서 한 판" />
                <E k="name" />
              </div>
              <div className="wt-field">
                <label className="wt-label">한 줄 소개 <span className="wt-req">*</span><span className="wt-counter">{f.tagline.length} / 60</span></label>
                <input className={'wt-input' + (touched && errs.tagline ? ' err' : '')} maxLength={60} value={f.tagline} onChange={(e) => set('tagline', e.target.value)} placeholder="예) 링크 하나로 친구와 바로 붙는 2인용 미니게임 모음" />
                <E k="tagline" />
              </div>
              <div className="wt-field">
                <label className="wt-label">카테고리 <span className="wt-req">*</span></label>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {WT_CATEGORIES.filter(c => c.id !== 'all').map(c => <button type="button" key={c.id} className={'wt-chip' + (f.cat === c.id ? ' on' : '')} onClick={() => set('cat', c.id)}>{c.label}</button>)}

              <div className="wt-field">
                <label className="wt-label">배포 상태 <span className="wt-req">*</span></label>

            <fieldset className="wt-fs">

                  {f.cover ? <div style={{ position: 'absolute', inset: 0 }}><Thumb s={preview} /><span className="wt-tag" style={{ position: 'absolute', top: 10, left: 10, background: '#fff' }}>클릭해서 교체</span></div>
                    : <div><Icon name="image" size={28} /><div style={{ marginTop: 8, fontWeight: 600 }}>이미지를 끌어다 놓거나 클릭해서 업로드</div><div style={{ fontSize: 12 }}>PNG, JPG · 최대 5MB</div></div>}
                </div>
                <E k="cover" />
              </div>
              <div className="wt-field">
                <label className="wt-label">스크린샷 <span className="wt-opt">선택 · 최대 6장</span></label>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  {Array.from({ length: f.shots }).map((_, i) => (
                    <div key={i} style={{ width: 132, position: 'relative', borderRadius: 6, overflow: 'hidden', border: '1px solid var(--wt-border)' }}>
                      <Thumb s={preview} v={i + 1} plain />
                      <button type="button" className="wt-iconbtn" style={{ position: 'absolute', top: 4, right: 4, width: 26, height: 26, background: 'rgba(36,36,36,.7)', color: '#fff' }} onClick={() => set('shots', f.shots - 1)}><Icon name="close" size={13} /></button>
                    </div>))}
                  {f.shots < 6 && <div className="wt-drop" style={{ width: 132, aspectRatio: '16/10' }} onClick={() => set('shots', f.shots + 1)}><div><Icon name="plus" size={20} /><div style={{ fontSize: 12 }}>추가</div></div></div>}
                </div>
              </div>
            </fieldset>

            <fieldset className="wt-fs">
              <legend>자세한 소개 <span className="wt-mono" style={{ background: 'var(--wt-light)', color: 'var(--wt-muted)' }}>선택</span></legend>
              <div className="wt-field">
                <label className="wt-label">상세 설명 <span className="wt-opt">나중에 작성해도 돼요</span>
                  <button type="button" className="wt-btn wt-btn-soft wt-btn-sm" style={{ marginLeft: 'auto', height: 26, fontSize: 12 }} onClick={() => { set('desc', (f.name || '이 서비스') + '은(는) ' + (f.tagline || '웹에서 바로 쓸 수 있는 서비스') + '예요. 회원가입 없이 바로 이용할 수 있고, 모바일과 데스크톱 모두 지원합니다.'); wt.toast('AI 초안이 입력되었어요 (목업)'); }}>
                    <Icon name="spark" size={13} />AI로 초안 쓰기</button><Scope kind="ext" /></label>
                <textarea className="wt-textarea" value={f.desc} onChange={(e) => set('desc', e.target.value)} placeholder={'어떤 서비스인지, 주요 기능과 추천 대상을 알려 주세요.\n예) 방을 만들고 링크를 보내면 바로 대결이 시작돼요…'} />
              </div>
              <div className="wt-field">
                <label className="wt-label">태그 <span className="wt-opt">최대 5개</span></label>
                <div className="wt-input" style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', height: 'auto', minHeight: 46, padding: '7px 10px' }}>
                  {f.tags.map(t => <span key={t} className="wt-tag" style={{ gap: 4 }}>#{t}<button type="button" onClick={() => set('tags', f.tags.filter(x => x !== t))} style={{ border: 0, background: 'none', padding: 0, display: 'flex', color: 'var(--wt-muted)' }}><Icon name="close" size={12} /></button></span>)}
                  <input value={tagIn} onChange={(e) => setTagIn(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(); } }} onBlur={addTag} placeholder={f.tags.length ? '' : '입력 후 Enter (예: 2인용, 무료)'} style={{ border: 0, outline: 0, flex: 1, minWidth: 120, fontSize: 14, background: 'transparent' }} />
                </div>
              </div>
            </fieldset>
          </div>

          <aside className="wt-form-aside">
            <div style={{ position: 'sticky', top: 88 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--wt-muted)', marginBottom: 10 }}>카드 미리보기</div>
              <div style={{ pointerEvents: 'none' }}><ServiceCard s={preview} /></div>
              <div className="wt-box" style={{ padding: 16, marginTop: 16 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 600 }}><span>필수 항목</span><span className="wt-mono">{filled} / {required.length}</span></div>
                <div style={{ height: 6, background: 'var(--wt-light)', borderRadius: 3, marginTop: 8, overflow: 'hidden' }}><div style={{ height: '100%', width: (filled / required.length * 100) + '%', background: 'var(--wt-navy)', transition: 'width .3s' }} /></div>
              </div>
              <button className="wt-btn wt-btn-primary wt-btn-lg wt-btn-block" style={{ marginTop: 16 }} onClick={submit}>{editing ? '수정 내용 저장' : '서비스 등록하기'}</button>
              {editing && <button className="wt-btn wt-btn-ghost wt-btn-block" style={{ marginTop: 8, height: 44 }} onClick={() => wt.go('manage')}>취소</button>}
            </div>
          </aside>
        </div>
      </div>
      <Footer />
    </>
  );
}

function RegisterPage() { return <ServiceForm mode="new" key="new" />; }
function EditPage() { const wt = useWt(); return <ServiceForm mode="edit" key={wt.route.params.id} />; }

/* ---------- 11 내 서비스 관리 ---------- */
function ManagePage() {

          {mine.length === 0 && <div className="wt-empty"><b>아직 등록한 서비스가 없어요</b>직접 만든 웹 서비스를 등록해 보세요.</div>}
