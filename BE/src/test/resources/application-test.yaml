# DB 접속 정보는 Testcontainers(@ServiceConnection)가 채운다.
# 스키마는 로컬과 같이 Flyway가 만들고, JPA는 엔티티와 DB가 맞는지 검증만 한다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  auth:
    # 개발 PC의 환경변수와 무관하게, 기본은 구글 로그인이 꺼진 상태로 시험한다
    google-client-id: ""
    google-client-secret: ""
  cors:
    allowed-origins: http://localhost:3000
