# 로컬 개발 전용 PostgreSQL. 운영 구성은 IN/ 을 따른다.
name: webter-local

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: webter
      POSTGRES_USER: webter
      POSTGRES_PASSWORD: webter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webter -d webter"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
