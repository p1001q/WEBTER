# 로컬 개발 전용 PostgreSQL·Redis. 운영 구성은 IN/ 을 따른다.
# Redis는 Redis 세션(SPRING_PROFILES_ACTIVE=local,redis-session)으로 확인할 때만 띄운다.
name: webter-local

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: webter
      POSTGRES_USER: webter
      POSTGRES_PASSWORD: webter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webter -d webter"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 운영(IN/runtime/compose.yml)과 같은 Redis 7.4. 로컬 확인용이라 비밀번호·디스크 보존 없이 띄운다.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
