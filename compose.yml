# 로컬 개발 전용: DB·Redis·BE·FE를 한 번에 띄운다(docker compose up --build). 운영 구성은 IN/ 을 따른다.
# DB·Redis는 BE/compose.yml 을 그대로 가져와 쓰므로 BE 폴더에서 띄우던 컨테이너와 데이터가 같다.
# 포트, 구글 클라이언트 값은 루트 .env 로 정한다(Git 제외, 예시는 .env.example).
name: webter-local

include:
  - path: BE/compose.yml

services:
  be:
    build: BE
    # local: Flyway 스키마·Swagger·메모리 대신 redis-session: Redis 세션
    environment:
      SPRING_PROFILES_ACTIVE: local,redis-session
      PORT: "8080"
      DB_HOST: db
      REDIS_HOST: redis
      # 브라우저가 접속하는 주소 기준이다(구글 콜백과 로그인 후 이동·CORS 허용 origin)
      AUTH_BACKEND_ORIGIN: http://localhost:${BE_PORT:-8080}
      AUTH_FRONTEND_ORIGIN: http://localhost:${FE_PORT:-3000}
      CORS_ALLOWED_ORIGINS: http://localhost:${FE_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${BE_PORT:-8080}:8080"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  fe:
    image: node:24.22.2
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BE_PORT:-8080}
      # pnpm 저장소를 마운트한 소스 폴더(FE/) 밖에 둔다
      npm_config_store_dir: /pnpm-store
    # 호스트 Node 버전과 무관하게 .nvmrc 와 같은 Node 24.22.2로 실행한다. 설치물은 컨테이너 볼륨에 둔다.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./FE:/app
      - fe_node_modules:/app/node_modules
      - fe_next:/app/.next
      - fe_pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:${FE_PORT:-3000}:3000"
    depends_on:
      - be

volumes:
  fe_node_modules:
  fe_next:
  fe_pnpm_store:
