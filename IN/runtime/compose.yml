name: webter

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: ${PROXY_IMAGE:?required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/webter/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/webter/data/caddy:/data
      - /srv/webter/data/caddy-config:/config
    networks:
      web:
        ipv4_address: 172.30.249.2
    mem_limit: 96m
    logging: *logging

  app:
    image: ${APP_IMAGE:?deploy an ECR digest first}
    restart: unless-stopped
    init: true
    env_file:
      - path: /srv/webter/data/config/app.env
        format: raw
    environment:
      PORT: ${APP_PORT:?required}
      HOSTNAME: 0.0.0.0
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: webter
      DB_USER: webter_app
      DB_PASSWORD: ${PG_APP_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SERVER_FORWARDHEADERSSTRATEGY: native
      SERVER_TOMCAT_REMOTEIP_REMOTEIPHEADER: X-Forwarded-For
      SERVER_TOMCAT_REMOTEIP_PROTOCOLHEADER: X-Forwarded-Proto
      # Tomcat은 web 네트워크에서 Caddy가 보내는 헤더만 신뢰한다.
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: 172.30.249.2/32
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [web, backend]
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  db:
    image: ${POSTGRES_IMAGE:?required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: webter
      POSTGRES_USER: webter_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?required}
      APP_DB_PASSWORD: ${PG_APP_PASSWORD:?required}
    volumes:
      - /srv/webter/data/postgres:/var/lib/postgresql/data
      - /opt/webter/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      # 최초 초기화에 쓰는 임시 PostgreSQL은 Unix 소켓만 연다.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "webter_admin", "-d", "webter"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [backend]
    mem_limit: 512m
    shm_size: 128m
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:?required}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 96mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - /srv/webter/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 128m
    logging: *logging

  migrate:
    # BE와 같은 Flyway 버전. 배포 스크립트가 이번 앱 이미지에서 추출한 SQL을 마운트한다.
    image: flyway/flyway:12.4.0@sha256:5be18367a9b3979a9f37234c371b80da457a448fb9577bd94d4bf24d923fafac
    profiles: [deploy]
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/webter
      FLYWAY_USER: webter_admin
      FLYWAY_PASSWORD: ${PG_ADMIN_PASSWORD:?required}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    networks: [backend]
    logging: *logging

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.249.0/29
  backend:
    internal: true
