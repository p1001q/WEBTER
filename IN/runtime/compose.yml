name: webter

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: ${PROXY_IMAGE:?required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/webter/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/webter/data/caddy:/data
      - /srv/webter/data/caddy-config:/config
    networks: [web]
    mem_limit: 96m
    logging: *logging

  app:
    image: ${APP_IMAGE:?deploy an ECR digest first}
    restart: unless-stopped
    init: true
    env_file:
      - path: /srv/webter/data/config/app.env
        format: raw
    environment:
      PORT: ${APP_PORT:?required}
      HOSTNAME: 0.0.0.0
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: webter
      DB_USER: webter_app
      DB_PASSWORD: ${PG_APP_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [web, backend]
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  db:
    image: ${POSTGRES_IMAGE:?required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: webter
      POSTGRES_USER: webter_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?required}
      APP_DB_PASSWORD: ${PG_APP_PASSWORD:?required}
    volumes:
      - /srv/webter/data/postgres:/var/lib/postgresql/data
      - /opt/webter/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webter_admin -d webter"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [backend]
    mem_limit: 512m
    shm_size: 128m
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:?required}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 96mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - /srv/webter/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 128m
    logging: *logging

networks:
  web: {}
  backend:
    internal: true
